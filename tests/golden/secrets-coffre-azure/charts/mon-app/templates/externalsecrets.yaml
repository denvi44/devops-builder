# Généré par DevOps Builder — à relire avant usage.
# Secrets lus dans Azure Key Vault par External Secrets (ClusterSecretStore « mon-app »).
{{- if not .Values.database.azure_database.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-azure-database'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-azure-database'
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: '{{ .Release.Namespace }}-azure-database'
      property: url
{{- end }}
{{- if not .Values.database.valkey.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-valkey'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-valkey'
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: '{{ "{{" }} .password {{ "}}" }}'
        url: redis://:{{ "{{" }} .password {{ "}}" }}@{{ .Release.Name }}-valkey:6379/0
  data:
  - secretKey: password
    remoteRef:
      key: '{{ .Release.Namespace }}-valkey'
      property: password
{{- end }}
