# Généré par DevOps Builder — à relire avant usage.
name: Pipeline matrice
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/mon-app:${{ github.sha }}
  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - build-image
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        cosign sign --yes "$IMAGE"
  deploy-dev:
    name: Mise à jour GitOps (Argo CD) — Développement
    runs-on: ubuntu-latest
    needs:
    - build-image
    - cosign
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Développement
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(dev): mon-app $TAG [skip ci]" && git push origin HEAD; fi
  deploy-staging:
    name: Mise à jour GitOps (Argo CD) — Préproduction
    runs-on: ubuntu-latest
    needs:
    - build-image
    - cosign
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Préproduction
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(staging): mon-app $TAG [skip ci]" && git push origin HEAD; fi
  deploy-production:
    name: Mise à jour GitOps (Argo CD) — Production
    runs-on: ubuntu-latest
    needs:
    - build-image
    - cosign
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Production
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(production): mon-app $TAG [skip ci]" && git push origin HEAD; fi
