# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - echo "$$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
- name: deploy-dev
  image: python:3.12-alpine
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - pip install --no-cache-dir "ansible-core>=2.21,<2.22" || pipx install "ansible-core>=2.21,<2.22"
  - ansible-galaxy collection install -r ansible/requirements.yml
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "$${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - export DEPLOY_REGISTRY="registry.example.com" DEPLOY_REGISTRY_USER="$$REGISTRY_USER" DEPLOY_REGISTRY_PASSWORD="$$REGISTRY_PASSWORD"
  - ansible-playbook -i ansible/inventories/dev.ini ansible/deploy.yml -e "image=$$IMAGE" -e "project=mon-app-dev" -e "deploy_env=dev" -e "app_host=dev.mon-app.example.com"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    ANSIBLE_CONFIG: ansible/ansible.cfg
  when:
  - branch: main
    event: push
- name: deploy-staging
  image: python:3.12-alpine
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - pip install --no-cache-dir "ansible-core>=2.21,<2.22" || pipx install "ansible-core>=2.21,<2.22"
  - ansible-galaxy collection install -r ansible/requirements.yml
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "$${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - export DEPLOY_REGISTRY="registry.example.com" DEPLOY_REGISTRY_USER="$$REGISTRY_USER" DEPLOY_REGISTRY_PASSWORD="$$REGISTRY_PASSWORD"
  - ansible-playbook -i ansible/inventories/staging.ini ansible/deploy.yml -e "image=$$IMAGE" -e "project=mon-app-staging" -e "deploy_env=staging" -e "app_host=staging.mon-app.example.com"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    ANSIBLE_CONFIG: ansible/ansible.cfg
  when:
  - branch: main
    event: push
- name: deploy-production
  image: python:3.12-alpine
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - pip install --no-cache-dir "ansible-core>=2.21,<2.22" || pipx install "ansible-core>=2.21,<2.22"
  - ansible-galaxy collection install -r ansible/requirements.yml
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "$${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - export DEPLOY_REGISTRY="registry.example.com" DEPLOY_REGISTRY_USER="$$REGISTRY_USER" DEPLOY_REGISTRY_PASSWORD="$$REGISTRY_PASSWORD"
  - ansible-playbook -i ansible/inventories/production.ini ansible/deploy.yml -e "image=$$IMAGE" -e "project=mon-app" -e "deploy_env=production" -e "app_host=mon-app.example.com"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    ANSIBLE_CONFIG: ansible/ansible.cfg
  when:
  - branch: main
    event: manual
