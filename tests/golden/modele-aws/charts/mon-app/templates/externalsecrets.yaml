# Généré par DevOps Builder — à relire avant usage.
# Secrets lus dans AWS Secrets Manager par External Secrets (ClusterSecretStore « mon-app »).
{{- if not .Values.database.aws_rds.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-aws-rds'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-aws-rds'
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: '{{ .Release.Namespace }}/aws-rds'
      property: url
{{- end }}
