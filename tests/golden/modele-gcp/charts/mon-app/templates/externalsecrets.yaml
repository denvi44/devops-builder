# Généré par DevOps Builder — à relire avant usage.
# Secrets lus dans Google Secret Manager par External Secrets (ClusterSecretStore « mon-app »).
{{- if not .Values.database.cloud_sql.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-cloud-sql'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-cloud-sql'
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: '{{ .Release.Namespace }}-cloud-sql'
      property: url
{{- end }}
