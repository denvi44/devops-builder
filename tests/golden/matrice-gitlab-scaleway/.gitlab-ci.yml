# Généré par DevOps Builder — à relire avant usage.
stages:
- build
- infra
- deploy
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: rg.fr-par.scw.cloud/mon-app/mon-app:$CI_COMMIT_SHORT_SHA
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$SCW_SECRET_KEY" | docker login "rg.fr-par.scw.cloud" -u nologin --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
iac-plan:
  stage: infra
  image:
    name: ghcr.io/opentofu/opentofu:1.10
    entrypoint:
    - ''
  script:
  - cd infra/terraform
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -out=plan.tfplan
  artifacts:
    paths:
    - infra/terraform/plan.tfplan
    expire_in: 1 week
iac-apply:
  stage: infra
  image:
    name: ghcr.io/opentofu/opentofu:1.10
    entrypoint:
    - ''
  script:
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false plan.tfplan
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - iac-plan
deploy:
  stage: deploy
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - apk add --no-cache curl bash openssl
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
  - export KUBECONFIG=/tmp/kubeconfig
  - helm upgrade --install mon-app charts/mon-app --namespace mon-app --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
