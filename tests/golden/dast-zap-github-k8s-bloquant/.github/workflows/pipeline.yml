# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/mon-app:${{ github.sha }}
  KUBECONFIG_DATA_DEV: ${{ secrets.KUBECONFIG_DATA_DEV }}
  KUBECONFIG_DATA_STAGING: ${{ secrets.KUBECONFIG_DATA_STAGING }}
  KUBECONFIG_DATA_PRODUCTION: ${{ secrets.KUBECONFIG_DATA_PRODUCTION }}
  ZAP_TARGET_URL: https://dev.boutique.fr
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    container: zricethezav/gitleaks:latest
    steps:
    - uses: actions/checkout@v4
    - name: Recherche de secrets
      run: |
        gitleaks detect --source . --verbose
  trivy:
    name: Scan de vulnérabilités Trivy
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    container: aquasec/trivy:latest
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - name: Scan de vulnérabilités Trivy
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        cosign sign --yes "$IMAGE"
  deploy-dev:
    name: Déploiement Helm — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Développement
      run: |
        echo "$KUBECONFIG_DATA_DEV" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-dev.yaml --namespace mon-app-dev --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  dast-dev:
    name: Analyse dynamique ZAP (scan complet) — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    container:
      image: ghcr.io/zaproxy/zaproxy:2.17.0
      options: --user root
    steps:
    - uses: actions/checkout@v4
    - name: Analyse dynamique ZAP (scan complet) — Développement
      run: |
        mkdir -p /zap/wrk && cp .zap/rules.tsv /zap/wrk/rules.tsv
        code=0; zap-full-scan.py -t "$ZAP_TARGET_URL" -c rules.tsv -r zap-report.html -J zap-report.json -I || code=$?
        cp /zap/wrk/zap-report.html /zap/wrk/zap-report.json . || true
        if [ "$code" -eq 3 ]; then echo "ZAP n'a pas pu analyser $ZAP_TARGET_URL (adresse injoignable depuis la CI ?)" >&2; fi
        exit "$code"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dast-dev
        path: |-
          zap-report.html
          zap-report.json
  deploy-staging:
    name: Déploiement Helm — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - deploy-dev
    - dast-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Préproduction
      run: |
        echo "$KUBECONFIG_DATA_STAGING" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-staging.yaml --namespace mon-app-staging --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  deploy-production:
    name: Déploiement Helm — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Production
      run: |
        echo "$KUBECONFIG_DATA_PRODUCTION" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-production.yaml --namespace mon-app --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
