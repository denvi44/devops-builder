# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - echo "$$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
- name: gitleaks
  image: zricethezav/gitleaks:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - gitleaks detect --source . --verbose
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
- name: trivy
  image: aquasec/trivy:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
- name: cosign
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache cosign
  - echo "$$REGISTRY_PASSWORD" | cosign login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - cosign sign --yes "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-dev
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ssh -o StrictHostKeyChecking=accept-new "$$DEPLOY_HOST_DEV" "mkdir -p /opt/mon-app-dev"
  - scp deploy/docker-compose.yml "$$DEPLOY_HOST_DEV:/opt/mon-app-dev/docker-compose.yml"
  - ssh "$$DEPLOY_HOST_DEV" "cd /opt/mon-app-dev && IMAGE=$$IMAGE docker compose -p mon-app-dev pull && IMAGE=$$IMAGE docker compose -p mon-app-dev up -d"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-staging
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ssh -o StrictHostKeyChecking=accept-new "$$DEPLOY_HOST_STAGING" "mkdir -p /opt/mon-app-staging"
  - scp deploy/docker-compose.yml "$$DEPLOY_HOST_STAGING:/opt/mon-app-staging/docker-compose.yml"
  - ssh "$$DEPLOY_HOST_STAGING" "cd /opt/mon-app-staging && IMAGE=$$IMAGE docker compose -p mon-app-staging pull && IMAGE=$$IMAGE docker compose -p mon-app-staging up -d"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-production
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ssh -o StrictHostKeyChecking=accept-new "$$DEPLOY_HOST_PRODUCTION" "mkdir -p /opt/mon-app"
  - scp deploy/docker-compose.yml "$$DEPLOY_HOST_PRODUCTION:/opt/mon-app/docker-compose.yml"
  - ssh "$$DEPLOY_HOST_PRODUCTION" "cd /opt/mon-app && IMAGE=$$IMAGE docker compose -p mon-app pull && IMAGE=$$IMAGE docker compose -p mon-app up -d"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    DEPLOY_HOST_DEV: à-renseigner
    DEPLOY_HOST_STAGING: à-renseigner
    DEPLOY_HOST_PRODUCTION: à-renseigner
  when:
  - branch: main
    event: manual
