# Généré par DevOps Builder — à relire avant usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-app
  template:
    metadata:
      labels:
        app: mon-app
    spec:
      containers:
      - name: mon-app
        image: mon-app:latest
        ports:
        - containerPort: 8000
        env:
        - name: OIDC_ISSUER_URL
          value: https://dex.boutique.fr
        - name: OIDC_CLIENT_ID
          value: mon-app
