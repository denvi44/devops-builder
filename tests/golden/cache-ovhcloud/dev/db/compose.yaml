# Généré par DevOps Builder — à relire avant usage. Bases du poste de développement : docker compose -f dev/db/compose.yaml up -d
name: mon-app-dev
services:
  valkey:
    image: valkey/valkey:8.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:6379:6379
    command:
    - valkey-server
    - --requirepass
    - dev
    volumes:
    - valkey-dev:/data
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli -a "dev" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  valkey-dev: {}
