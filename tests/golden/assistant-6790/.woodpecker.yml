# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - echo "$$SCW_SECRET_KEY" | docker login "rg.fr-par.scw.cloud" -u nologin --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: gitleaks
  image: zricethezav/gitleaks:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - gitleaks detect --source . --verbose
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: trivy
  image: aquasec/trivy:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: cosign
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - apk add --no-cache cosign
  - echo "$$SCW_SECRET_KEY" | cosign login "rg.fr-par.scw.cloud" -u nologin --password-stdin
  - cosign sign --yes "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
- name: iac-plan
  image: hashicorp/terraform:1.9
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - cd infra/terraform
  - terraform init -input=false
  - terraform validate
  - terraform plan -input=false -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: iac-apply
  image: hashicorp/terraform:1.9
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - cd infra/terraform
  - terraform init -input=false
  - terraform apply -input=false plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-dev
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'git commit -am "deploy(dev): mon-app $$TAG" && git push origin HEAD'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-staging
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'git commit -am "deploy(staging): mon-app $$TAG" && git push origin HEAD'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-production
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'git commit -am "deploy(production): mon-app $$TAG" && git push origin HEAD'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: manual
