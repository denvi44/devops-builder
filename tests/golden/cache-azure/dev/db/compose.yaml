# Généré par DevOps Builder — à relire avant usage. Bases du poste de développement : docker compose -f dev/db/compose.yaml up -d
name: mon-app-dev
services:
  redis:
    image: redis:8
    restart: unless-stopped
    ports:
    - 127.0.0.1:6379:6379
    command:
    - redis-server
    - --requirepass
    - dev
    volumes:
    - redis-dev:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "dev" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  redis-dev: {}
