# Gitea Actions reprend la syntaxe GitHub Actions ; vérifier la disponibilité des actions
# tierces et l'émission de jetons OIDC sur votre instance (act_runner).
# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: rg.fr-par.scw.cloud/mon-app/mon-app:${{ github.sha }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  sonarqube:
    name: Qualité SonarQube
    runs-on: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - uses: actions/checkout@v4
    - name: Qualité SonarQube
      run: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$SCW_SECRET_KEY" | docker login "rg.fr-par.scw.cloud" -u nologin --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    container: zricethezav/gitleaks:latest
    steps:
    - uses: actions/checkout@v4
    - name: Recherche de secrets
      run: |
        gitleaks detect --source . --verbose
  trivy:
    name: Scan de vulnérabilités Trivy
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    container: aquasec/trivy:latest
    env:
      TRIVY_USERNAME: nologin
      TRIVY_PASSWORD: $SCW_SECRET_KEY
    steps:
    - uses: actions/checkout@v4
    - name: Scan de vulnérabilités Trivy
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$SCW_SECRET_KEY" | cosign login "rg.fr-par.scw.cloud" -u nologin --password-stdin
        cosign sign --yes "$IMAGE"
  deploy:
    name: Mise à jour GitOps (Argo CD)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD)
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        yq -i '.image.tag = strenv(TAG)' charts/mon-app/values.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        git commit -am "deploy: mon-app $TAG" && git push origin HEAD
