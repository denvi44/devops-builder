# Généré par DevOps Builder — à relire avant usage.
name: mon-app
services:
  mon-app:
    image: ${IMAGE:-$CI_REGISTRY_IMAGE:latest}
    restart: unless-stopped
    environment:
      PORT: '8000'
    labels:
    - traefik.enable=true
    - traefik.http.routers.mon-app.rule=Host(`${APP_HOST:-mon-app.example.com}`)
    - traefik.http.routers.mon-app.entrypoints=websecure
    - traefik.http.services.mon-app.loadbalancer.server.port=8000
  traefik:
    image: traefik:v3.1
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    ports:
    - ${PORT_TRAEFIK_80:-80}:80
    - ${PORT_TRAEFIK_443:-443}:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  prometheus:
    image: prom/prometheus:latest
    ports:
    - ${PORT_PROMETHEUS_9090:-9090}:9090
    volumes:
    - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    ports:
    - ${PORT_GRAFANA_3000:-3000}:3000
    volumes:
    - grafana-data:/var/lib/grafana
volumes:
  grafana-data: {}
  prometheus-data: {}
