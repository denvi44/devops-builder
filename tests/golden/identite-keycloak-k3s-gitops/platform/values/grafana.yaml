# Généré par DevOps Builder — à relire avant usage. Grafana : connexion par Keycloak.
grafana.ini:
  server:
    root_url: https://grafana.boutique.fr
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    client_id: grafana
    client_secret: $__env{GRAFANA_OIDC_SECRET}
    scopes: openid profile email groups
    auth_url: https://auth.boutique.fr/realms/mon-app/protocol/openid-connect/auth
    token_url: https://auth.boutique.fr/realms/mon-app/protocol/openid-connect/token
    api_url: https://auth.boutique.fr/realms/mon-app/protocol/openid-connect/userinfo
    use_pkce: true
    role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
envFromSecret: grafana-oidc
