# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Vault lu par la CI
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/boutique:${{ github.sha }}
  KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
  VAULT_ADDR: https://vault.exemple.fr
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  deploy:
    name: Déploiement Helm
    runs-on: ubuntu-latest
    needs:
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm
      run: |
        echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        SECRETS_ENV="$(bash scripts/secrets-fetch.sh production)"
        eval "$SECRETS_ENV"
        helm upgrade --install boutique charts/boutique --namespace boutique --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --set-string database.postgresql.password="$POSTGRESQL_PASSWORD" --wait
