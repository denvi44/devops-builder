# Généré par DevOps Builder — à relire avant usage.
- name: Déployer mon-app
  hosts: app
  become: true
  serial: 1
  vars:
    image: $CI_REGISTRY_IMAGE:latest
    project: mon-app
    app_dir: /opt/{{ project }}
    registry_host: '{{ lookup(''ansible.builtin.env'', ''DEPLOY_REGISTRY'') }}'
    registry_user: '{{ lookup(''ansible.builtin.env'', ''DEPLOY_REGISTRY_USER'') }}'
    registry_password: '{{ lookup(''ansible.builtin.env'', ''DEPLOY_REGISTRY_PASSWORD'') }}'
  tasks:
    - name: Créer le répertoire de l'application
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: directory
        mode: '0755'
    - name: Copier le fichier Compose
      ansible.builtin.copy:
        src: ../deploy/docker-compose.yml
        dest: '{{ app_dir }}/docker-compose.yml'
        mode: '0644'
    - name: Copier les secrets des bases de données
      ansible.builtin.copy:
        src: ../.secrets/
        dest: '{{ app_dir }}/secrets/'
        mode: '0600'
        directory_mode: '0700'
      no_log: true
    - name: Copier le script de sauvegarde des bases
      ansible.builtin.copy:
        src: ../scripts/db-backup.sh
        dest: '{{ app_dir }}/db-backup.sh'
        mode: '0750'
    - name: Copier le script de restauration des bases
      ansible.builtin.copy:
        src: ../scripts/db-restore.sh
        dest: '{{ app_dir }}/db-restore.sh'
        mode: '0750'
    - name: Planifier la sauvegarde quotidienne des bases
      ansible.builtin.cron:
        name: sauvegarde des bases {{ project }}
        hour: '3'
        minute: '15'
        job: '{{ app_dir }}/db-backup.sh {{ app_dir }} >/dev/null'
    - name: Se connecter au registre d'images
      ansible.builtin.command:
        argv:
          - docker
          - login
          - '{{ registry_host }}'
          - --username
          - '{{ registry_user }}'
          - --password-stdin
        stdin: '{{ registry_password }}'
      no_log: true
      changed_when: false
      when: registry_password | length > 0
    - name: Démarrer les services
      community.docker.docker_compose_v2:
        project_src: '{{ app_dir }}'
        project_name: '{{ project }}'
        pull: always
        state: present
        wait: true
        wait_timeout: 180
      environment:
        IMAGE: '{{ image }}'
