# Généré par DevOps Builder — à relire avant usage.
name: boutique
services:
  boutique:
    image: ${IMAGE:-$CI_REGISTRY_IMAGE:latest}
    restart: unless-stopped
    environment:
      PORT: '8000'
    labels:
    - traefik.enable=true
    - traefik.http.routers.boutique.rule=Host(`${APP_HOST:-boutique.example.com}`)
    - traefik.http.routers.boutique.entrypoints=websecure
    - traefik.http.services.boutique.loadbalancer.server.port=8000
    env_file:
    - secrets/app.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
  migrate:
    image: ${IMAGE:-$CI_REGISTRY_IMAGE:latest}
    command:
    - sh
    - -c
    - alembic upgrade head
    env_file:
    - secrets/app.env
    restart: 'no'
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_healthy
  postgresql:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
    env_file:
    - secrets/postgresql.env
    volumes:
    - postgresql-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    env_file:
    - secrets/valkey.env
    command:
    - sh
    - -c
    - exec valkey-server --requirepass "$${VALKEY_PASSWORD}" --appendonly yes
    volumes:
    - valkey-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  traefik:
    image: traefik:v3.1
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    ports:
    - ${PORT_TRAEFIK_80:-80}:80
    - ${PORT_TRAEFIK_443:-443}:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  prometheus:
    image: prom/prometheus:latest
    ports:
    - ${PORT_PROMETHEUS_9090:-9090}:9090
    volumes:
    - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    ports:
    - ${PORT_GRAFANA_3000:-3000}:3000
    volumes:
    - grafana-data:/var/lib/grafana
volumes:
  grafana-data: {}
  postgresql-data: {}
  prometheus-data: {}
  valkey-data: {}
