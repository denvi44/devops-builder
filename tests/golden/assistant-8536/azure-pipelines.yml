# Généré par DevOps Builder — à relire avant usage. Pour Azure, préférer une connexion de service à fédération d'identité (tâche AzureCLI@2).
trigger:
- main
variables:
  TAG: $(Build.SourceVersion)
  IMAGE: rg.fr-par.scw.cloud/mon-app/mon-app:$(Build.SourceVersion)
stages:
- stage: test
  jobs:
  - job: unit_tests
    displayName: Tests unitaires
    pool:
      vmImage: ubuntu-latest
    container: python:3.12-slim
    steps:
    - script: |
        pip install -r requirements.txt
        pytest -q
      displayName: Tests unitaires
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        SCW_SECRET_KEY: $(SCW_SECRET_KEY)
        SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
        SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
  - job: sonarqube
    displayName: Qualité SonarQube
    pool:
      vmImage: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - script: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
      displayName: Qualité SonarQube
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        SCW_SECRET_KEY: $(SCW_SECRET_KEY)
        SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
        SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: build
  jobs:
  - job: build_image
    displayName: Build et publication de l'image (BuildKit (docker buildx))
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "$SCW_SECRET_KEY" | docker login "rg.fr-par.scw.cloud" -u nologin --password-stdin
        docker buildx build --tag "$IMAGE" --push .
      displayName: Build et publication de l'image (BuildKit (docker buildx))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        SCW_SECRET_KEY: $(SCW_SECRET_KEY)
        SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
        SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: infra
  jobs:
  - job: iac_plan
    displayName: Plan OpenTofu
    pool:
      vmImage: ubuntu-latest
    container: alpine:3.20
    steps:
    - script: |
        apk add --no-cache curl unzip
        curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
        unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
        export AWS_ACCESS_KEY_ID="$SCW_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SCW_SECRET_KEY"
        cd infra/terraform
        tofu fmt -check -recursive
        tofu init -input=false
        tofu validate
        tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
      displayName: Plan OpenTofu
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        SCW_SECRET_KEY: $(SCW_SECRET_KEY)
        SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
        SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
  - job: iac_apply
    displayName: Application OpenTofu
    pool:
      vmImage: ubuntu-latest
    container: alpine:3.20
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        apk add --no-cache curl unzip
        curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
        unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
        export AWS_ACCESS_KEY_ID="$SCW_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$SCW_SECRET_KEY"
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false -lock-timeout=5m plan.tfplan
      displayName: Application OpenTofu
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        SCW_SECRET_KEY: $(SCW_SECRET_KEY)
        SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
        SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: deploy_dev
  displayName: Déploiement — Développement
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_dev
    displayName: Mise à jour GitOps (Argo CD) — Développement
    environment: dev
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              apk add --no-cache git yq
              git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
              cd gitops
              yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
              git config user.email "ci@example.com" && git config user.name "CI"
              git commit -am "deploy(dev): mon-app $TAG" && git push origin HEAD
            displayName: Mise à jour GitOps (Argo CD) — Développement
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              SCW_SECRET_KEY: $(SCW_SECRET_KEY)
              SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
              SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: deploy_staging
  displayName: Déploiement — Préproduction
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_staging
    displayName: Mise à jour GitOps (Argo CD) — Préproduction
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              apk add --no-cache git yq
              git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
              cd gitops
              yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
              git config user.email "ci@example.com" && git config user.name "CI"
              git commit -am "deploy(staging): mon-app $TAG" && git push origin HEAD
            displayName: Mise à jour GitOps (Argo CD) — Préproduction
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              SCW_SECRET_KEY: $(SCW_SECRET_KEY)
              SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
              SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: deploy_production
  displayName: Déploiement — Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_production
    displayName: Mise à jour GitOps (Argo CD) — Production
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              apk add --no-cache git yq
              git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
              cd gitops
              yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
              git config user.email "ci@example.com" && git config user.name "CI"
              git commit -am "deploy(production): mon-app $TAG" && git push origin HEAD
            displayName: Mise à jour GitOps (Argo CD) — Production
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              SCW_SECRET_KEY: $(SCW_SECRET_KEY)
              SCW_ACCESS_KEY: $(SCW_ACCESS_KEY)
              SCW_DEFAULT_PROJECT_ID: $(SCW_DEFAULT_PROJECT_ID)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
