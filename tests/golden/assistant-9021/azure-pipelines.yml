# Généré par DevOps Builder — à relire avant usage. Pour Azure, préférer une connexion de service à fédération d'identité (tâche AzureCLI@2).
trigger:
- main
variables:
  TAG: $(Build.SourceVersion)
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$(Build.SourceVersion)
stages:
- stage: test
  jobs:
  - job: unit_tests
    displayName: Tests unitaires
    pool:
      vmImage: ubuntu-latest
    container: python:3.12-slim
    steps:
    - script: |
        pip install -r requirements.txt
        pytest -q
      displayName: Tests unitaires
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
  - job: sonarqube
    displayName: Qualité SonarQube
    pool:
      vmImage: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - script: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
      displayName: Qualité SonarQube
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
- stage: build
  jobs:
  - job: build_image
    displayName: Build et publication de l'image (BuildKit (docker buildx))
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        apk add --no-cache aws-cli || true
        aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
        docker buildx build --tag "$IMAGE" --push .
      displayName: Build et publication de l'image (BuildKit (docker buildx))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
- stage: security
  jobs:
  - job: gitleaks
    displayName: Recherche de secrets
    pool:
      vmImage: ubuntu-latest
    container: zricethezav/gitleaks:latest
    steps:
    - script: |
        gitleaks detect --source . --verbose
      displayName: Recherche de secrets
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
  - job: trivy
    displayName: Scan de vulnérabilités Trivy
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
      displayName: Scan de vulnérabilités Trivy
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
- stage: publish
  jobs:
  - job: cosign
    displayName: Signature de l'image (Cosign)
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        apk add --no-cache cosign
        apk add --no-cache aws-cli
        aws ecr get-login-password --region eu-west-3 | cosign login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
        cosign sign --yes "$IMAGE"
      displayName: Signature de l'image (Cosign)
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
- stage: infra
  jobs:
  - job: iac_plan
    displayName: Plan OpenTofu
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        apk add --no-cache curl unzip
        curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
        unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
        cd infra/terraform
        tofu fmt -check -recursive
        tofu init -input=false
        tofu validate
        tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
      displayName: Plan OpenTofu
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
  - job: iac_apply
    displayName: Application OpenTofu
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        apk add --no-cache curl unzip
        curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
        unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false -lock-timeout=5m plan.tfplan
      displayName: Application OpenTofu
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
- stage: deploy_staging
  displayName: Déploiement — Préproduction
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_staging
    displayName: Déploiement ECS — Préproduction
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
              aws ecs update-service --cluster mon-cluster-ecs --service mon-app-staging --force-new-deployment
            displayName: Déploiement ECS — Préproduction
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
- stage: deploy_production
  displayName: Déploiement — Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_production
    displayName: Déploiement ECS — Production
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
              aws ecs update-service --cluster mon-cluster-ecs --service mon-app --force-new-deployment
            displayName: Déploiement ECS — Production
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
