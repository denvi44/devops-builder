# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - echo "$$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: iac-plan
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - export AWS_ACCESS_KEY_ID="$$OVH_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$OVH_S3_SECRET_KEY"
  - cd infra/terraform
  - tofu fmt -check -recursive
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
- name: iac-apply
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - export AWS_ACCESS_KEY_ID="$$OVH_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$OVH_S3_SECRET_KEY"
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false -lock-timeout=5m plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-dev
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'git commit -am "deploy(dev): mon-app $$TAG" && git push origin HEAD'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    OVH_APPLICATION_KEY:
      from_secret: ovh_application_key
    OVH_APPLICATION_SECRET:
      from_secret: ovh_application_secret
    OVH_CONSUMER_KEY:
      from_secret: ovh_consumer_key
    OVH_S3_ACCESS_KEY:
      from_secret: ovh_s3_access_key
    OVH_S3_SECRET_KEY:
      from_secret: ovh_s3_secret_key
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
