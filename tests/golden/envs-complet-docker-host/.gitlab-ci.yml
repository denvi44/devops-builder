# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- security
- publish
- deploy-sandbox
- deploy-dev
- deploy-recette
- deploy-staging
- deploy-production
- renovate
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --verbose
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint:
    - ''
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
cosign:
  stage: publish
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  script:
  - apk add --no-cache cosign
  - echo "$CI_REGISTRY_PASSWORD" | cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - cosign sign --yes "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-sandbox:
  stage: deploy-sandbox
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: sandbox
  script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_SANDBOX" "mkdir -p /opt/mon-app-sandbox"
  - scp deploy/docker-compose.yml "$DEPLOY_HOST_SANDBOX:/opt/mon-app-sandbox/docker-compose.yml"
  - echo "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_HOST_SANDBOX" "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
  - ssh "$DEPLOY_HOST_SANDBOX" "cd /opt/mon-app-sandbox && IMAGE=$IMAGE APP_HOST=sandbox.mon-app.example.com docker compose -p mon-app-sandbox pull && IMAGE=$IMAGE APP_HOST=sandbox.mon-app.example.com docker
    compose -p mon-app-sandbox up -d"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-dev:
  stage: deploy-dev
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: dev
  script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_DEV" "mkdir -p /opt/mon-app-dev"
  - scp deploy/docker-compose.yml "$DEPLOY_HOST_DEV:/opt/mon-app-dev/docker-compose.yml"
  - echo "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_HOST_DEV" "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
  - ssh "$DEPLOY_HOST_DEV" "cd /opt/mon-app-dev && IMAGE=$IMAGE APP_HOST=dev.mon-app.example.com docker compose -p mon-app-dev pull && IMAGE=$IMAGE APP_HOST=dev.mon-app.example.com docker compose -p mon-app-dev
    up -d"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
  - deploy-sandbox
deploy-recette:
  stage: deploy-recette
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: recette
  script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_RECETTE" "mkdir -p /opt/mon-app-recette"
  - scp deploy/docker-compose.yml "$DEPLOY_HOST_RECETTE:/opt/mon-app-recette/docker-compose.yml"
  - echo "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_HOST_RECETTE" "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
  - ssh "$DEPLOY_HOST_RECETTE" "cd /opt/mon-app-recette && IMAGE=$IMAGE APP_HOST=recette.mon-app.example.com docker compose -p mon-app-recette pull && IMAGE=$IMAGE APP_HOST=recette.mon-app.example.com docker
    compose -p mon-app-recette up -d"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
  - deploy-dev
deploy-staging:
  stage: deploy-staging
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: staging
  script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_STAGING" "mkdir -p /opt/mon-app-staging"
  - scp deploy/docker-compose.yml "$DEPLOY_HOST_STAGING:/opt/mon-app-staging/docker-compose.yml"
  - echo "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_HOST_STAGING" "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
  - ssh "$DEPLOY_HOST_STAGING" "cd /opt/mon-app-staging && IMAGE=$IMAGE APP_HOST=staging.mon-app.example.com docker compose -p mon-app-staging pull && IMAGE=$IMAGE APP_HOST=staging.mon-app.example.com docker
    compose -p mon-app-staging up -d"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
  - deploy-recette
deploy-production:
  stage: deploy-production
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_PRODUCTION" "mkdir -p /opt/mon-app"
  - scp deploy/docker-compose.yml "$DEPLOY_HOST_PRODUCTION:/opt/mon-app/docker-compose.yml"
  - echo "$CI_REGISTRY_PASSWORD" | ssh "$DEPLOY_HOST_PRODUCTION" "docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin"
  - ssh "$DEPLOY_HOST_PRODUCTION" "cd /opt/mon-app && IMAGE=$IMAGE APP_HOST=mon-app.example.com docker compose -p mon-app pull && IMAGE=$IMAGE APP_HOST=mon-app.example.com docker compose -p mon-app up -d"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - deploy-staging
renovate:
  stage: renovate
  image:
    name: renovate/renovate:44.164.5
    entrypoint:
    - ''
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "1"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
  - renovate
