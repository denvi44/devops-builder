format_version: 2
name: Modèle Outscale (SecNumCloud)
description: 'Exigence SecNumCloud : machines virtuelles créées par OpenTofu et configurées
  par Ansible, Docker Compose et Traefik, PostgreSQL sur chaque machine ; état dans
  le stockage objet d''Outscale ; secrets chiffrés dans le dépôt (SOPS et age) ; GitLab
  CI avec les clés d''accès d''Outscale. Le Kubernetes managé d''Outscale (OKS) n''a
  pas encore de ressource OpenTofu générée.'
target: vm
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: true
cloud_auth: oidc
license_policy: any
app:
  language: python
  image_name: mon-app
  port: 8000
