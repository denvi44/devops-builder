{{- if .Values.database.valkey.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-valkey
type: Opaque
stringData:
  password: {{ required "Values.database.valkey.password : mot de passe de Valkey" .Values.database.valkey.password | quote }}
  url: {{ printf "redis://:%s@%s-valkey:6379/0" .Values.database.valkey.password .Release.Name | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Release.Name }}-valkey'
  labels:
    app.kubernetes.io/name: mon-app-valkey
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  selector:
    app.kubernetes.io/name: mon-app-valkey
    app.kubernetes.io/instance: '{{ .Release.Name }}'
  ports:
  - port: 6379
    targetPort: 6379
    name: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ .Release.Name }}-valkey'
  labels:
    app.kubernetes.io/name: mon-app-valkey
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ .Release.Name }}-valkey'
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mon-app-valkey
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mon-app-valkey
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      containers:
      - name: valkey
        image: '{{ .Values.database.valkey.image }}'
        ports:
        - containerPort: 6379
          name: valkey
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-valkey'
              key: password
        command:
        - sh
        - -c
        - exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - valkey-cli -a "${VALKEY_PASSWORD}" --no-auth-warning ping | grep -q PONG
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: '{{ .Values.database.valkey.storage }}'
