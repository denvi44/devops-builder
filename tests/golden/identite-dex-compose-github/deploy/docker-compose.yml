# Généré par DevOps Builder — à relire avant usage.
name: mon-app
services:
  mon-app:
    image: ${IMAGE:-ghcr.io/OWNER/mon-app:latest}
    restart: unless-stopped
    environment:
      PORT: '8000'
      OIDC_ISSUER_URL: https://dex.boutique.fr
      OIDC_CLIENT_ID: mon-app
    labels:
    - traefik.enable=true
    - traefik.http.routers.mon-app.rule=Host(`mon-app.example.com`)
    - traefik.http.routers.mon-app.entrypoints=websecure
    - traefik.http.services.mon-app.loadbalancer.server.port=8000
  traefik:
    image: traefik:v3.1
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.http.tls.certresolver=letsencrypt
    - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
    - 80:80
    - 443:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik-letsencrypt:/letsencrypt
  prometheus:
    image: prom/prometheus:latest
    ports:
    - 9090:9090
    volumes:
    - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:latest
    ports:
    - 3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.example.com
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: Dex
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://dex.boutique.fr/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://dex.boutique.fr/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://dex.boutique.fr/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
    env_file:
    - secrets/grafana.env
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    restart: unless-stopped
    command:
    - dex
    - serve
    - /etc/dex/config.yaml
    env_file:
    - secrets/dex.env
    configs:
    - source: dex-config
      target: /etc/dex/config.yaml
    volumes:
    - dex-data:/var/dex
    labels:
    - traefik.enable=true
    - traefik.http.routers.dex.rule=Host(`dex.boutique.fr`)
    - traefik.http.routers.dex.entrypoints=websecure
    - traefik.http.services.dex.loadbalancer.server.port=5556
volumes:
  dex-data: {}
  grafana-data: {}
  prometheus-data: {}
  traefik-letsencrypt: {}
configs:
  dex-config:
    content: |
      issuer: https://dex.boutique.fr
      storage:
        type: sqlite3
        config:
          file: /var/dex/dex.db
      web:
        http: 0.0.0.0:5556
      oauth2:
        skipApprovalScreen: true
      connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $DEX_CONNECTOR_ID
          clientSecret: $DEX_CONNECTOR_SECRET
          redirectURI: https://dex.boutique.fr/callback
      staticClients:
      - id: mon-app
        name: mon-app
        public: true
        redirectURIs:
        - https://app.example.com/callback
        - https://app.example.com/oauth2/callback
      - id: grafana
        name: grafana
        secretEnv: GRAFANA_OIDC_SECRET
        redirectURIs:
        - https://grafana.example.com/login/generic_oauth
