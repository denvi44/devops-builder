# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/mon-app:${{ github.sha }}
  TF_VAR_ssh_public_key: ${{ vars.TF_VAR_ssh_public_key }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    container: zricethezav/gitleaks:latest
    steps:
    - uses: actions/checkout@v4
    - name: Recherche de secrets
      run: |
        gitleaks detect --source . --verbose
  trivy:
    name: Scan de vulnérabilités Trivy
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    container: aquasec/trivy:latest
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - name: Scan de vulnérabilités Trivy
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        cosign sign --yes "$IMAGE"
  iac-plan:
    name: Plan OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - name: Plan OpenTofu
      run: |
        cd infra/terraform
        tofu fmt -check -recursive
        tofu init -input=false
        tofu validate
        tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
    - uses: actions/upload-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform/plan.tfplan
  iac-apply:
    name: Application OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: terraform
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - uses: actions/download-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform
    - name: Application OpenTofu
      run: |
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false -lock-timeout=5m plan.tfplan
  deploy-staging:
    name: Déploiement Docker Compose (SSH) — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    - iac-apply
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - name: Déploiement Docker Compose (SSH) — Préproduction
      run: |
        export DEPLOY_HOST_STAGING="deploy@$(bash scripts/tf-inventory.sh --first staging)"
        mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
        ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_STAGING" "mkdir -p /opt/mon-app-staging"
        scp deploy/docker-compose.yml "$DEPLOY_HOST_STAGING:/opt/mon-app-staging/docker-compose.yml"
        echo "$GITHUB_TOKEN" | ssh "$DEPLOY_HOST_STAGING" "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
        ssh "$DEPLOY_HOST_STAGING" "cd /opt/mon-app-staging && IMAGE=$IMAGE APP_HOST=staging.mon-app.example.com docker compose -p mon-app-staging pull && IMAGE=$IMAGE APP_HOST=staging.mon-app.example.com docker compose -p mon-app-staging up -d"
  deploy-production:
    name: Déploiement Docker Compose (SSH) — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    - iac-apply
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - name: Déploiement Docker Compose (SSH) — Production
      run: |
        export DEPLOY_HOST_PRODUCTION="deploy@$(bash scripts/tf-inventory.sh --first production)"
        mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
        ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_PRODUCTION" "mkdir -p /opt/mon-app"
        scp deploy/docker-compose.yml "$DEPLOY_HOST_PRODUCTION:/opt/mon-app/docker-compose.yml"
        echo "$GITHUB_TOKEN" | ssh "$DEPLOY_HOST_PRODUCTION" "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
        ssh "$DEPLOY_HOST_PRODUCTION" "cd /opt/mon-app && IMAGE=$IMAGE APP_HOST=mon-app.example.com docker compose -p mon-app pull && IMAGE=$IMAGE APP_HOST=mon-app.example.com docker compose -p mon-app up -d"
