    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
  when:
  - branch: main
    event: manual
