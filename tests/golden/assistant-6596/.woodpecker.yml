# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - echo "$$REGISTRY_PASSWORD" | docker login "monappregistry.azurecr.io" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: gitleaks
  image: zricethezav/gitleaks:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - gitleaks detect --source . --verbose
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: trivy
  image: aquasec/trivy:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: cosign
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - apk add --no-cache cosign
  - echo "$$REGISTRY_PASSWORD" | cosign login "monappregistry.azurecr.io" -u "$$REGISTRY_USER" --password-stdin
  - cosign sign --yes "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
  when:
  - branch: main
    event: push
- name: iac-plan
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu fmt -check -recursive
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
- name: iac-apply
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false -lock-timeout=5m plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-dev
  image: mcr.microsoft.com/azure-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="monappregistry.azurecr.io/mon-app:$$TAG"
  - export ARM_CLIENT_ID="$$AZURE_CLIENT_ID" ARM_TENANT_ID="$$AZURE_TENANT_ID" ARM_SUBSCRIPTION_ID="$$AZURE_SUBSCRIPTION_ID"
  - export ARM_CLIENT_SECRET="$$AZURE_CLIENT_SECRET"
  - if command -v az >/dev/null; then az login --service-principal -u "$$AZURE_CLIENT_ID" -p "$$AZURE_CLIENT_SECRET" -t "$$AZURE_TENANT_ID" >/dev/null; fi
  - az aks install-cli
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - az aks get-credentials --name mon-cluster --resource-group rg-mon-app
  - helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-dev.yaml --namespace mon-app-dev --create-namespace --set image.repository="$${IMAGE%:*}" --set image.tag="$$TAG" --wait
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SONAR_HOST_URL: à-renseigner
    AZURE_CLIENT_ID: à-renseigner
    AZURE_TENANT_ID: à-renseigner
    AZURE_SUBSCRIPTION_ID: à-renseigner
    AZURE_INFRA_CLIENT_ID: à-renseigner
  when:
  - branch: main
    event: push
