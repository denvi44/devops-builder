# Généré par DevOps Builder — à relire avant usage.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops
  namespace: flux-system
spec:
  interval: 1m
  url: https://git.example.com/groupe/gitops.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mon-app-dev
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kustomize/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops
  targetNamespace: mon-app-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mon-app-staging
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kustomize/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops
  targetNamespace: mon-app-staging
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mon-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kustomize/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops
  targetNamespace: mon-app
