# Généré par DevOps Builder — à relire avant usage. Les secrets se déclarent via availableSecrets (Secret Manager).
steps:
- id: deploy-production
  name: google/cloud-sdk:latest
  entrypoint: sh
  args:
  - -c
  - |-
    export TAG="$SHORT_SHA"
    export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$SHORT_SHA"
    echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
    export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
    if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    gcloud container clusters get-credentials mon-cluster --region europe-west9 --project mon-projet
    helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-production.yaml --namespace mon-app --create-namespace --set image.repository="$${IMAGE%:*}" --set image.tag="$$TAG" --wait
options:
  logging: CLOUD_LOGGING_ONLY
