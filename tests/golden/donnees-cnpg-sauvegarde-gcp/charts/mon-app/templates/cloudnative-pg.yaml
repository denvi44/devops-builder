apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: '{{ .Release.Name }}-pg'
spec:
  instances: {{ .Values.database.cloudnative_pg.instances }}
  imageName: '{{ .Values.database.cloudnative_pg.image }}'
  storage:
    size: '{{ .Values.database.cloudnative_pg.storage }}'
  bootstrap:
    initdb:
      database: app
      owner: app
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: '{{ .Release.Name }}-backups'
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: '{{ .Release.Name }}-backups'
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: gs://mon-app-db-backups/{{ .Release.Namespace }}
    googleCredentials:
      gkeEnvironment: true
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: '{{ .Release.Name }}-pg-quotidien'
spec:
  schedule: 0 0 3 * * *
  backupOwnerReference: self
  cluster:
    name: '{{ .Release.Name }}-pg'
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
