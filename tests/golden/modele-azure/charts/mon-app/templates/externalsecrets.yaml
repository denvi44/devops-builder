# Généré par DevOps Builder — à relire avant usage.
# Secrets lus dans Azure Key Vault par External Secrets (ClusterSecretStore « mon-app »).
{{- if not .Values.database.azure_database.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-azure-database'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-azure-database'
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: '{{ .Release.Namespace }}-azure-database'
      property: url
{{- end }}
