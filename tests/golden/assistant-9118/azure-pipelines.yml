# Généré par DevOps Builder — à relire avant usage. Pour Azure, préférer une connexion de service à fédération d'identité (tâche AzureCLI@2).
trigger:
- main
variables:
  TAG: $(Build.SourceVersion)
  IMAGE: europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$(Build.SourceVersion)
stages:
- stage: test
  jobs:
  - job: unit_tests
    displayName: Tests unitaires
    pool:
      vmImage: ubuntu-latest
    container: python:3.12-slim
    steps:
    - script: |
        pip install -r requirements.txt
        pytest -q
      displayName: Tests unitaires
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
  - job: sonarqube
    displayName: Qualité SonarQube
    pool:
      vmImage: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - script: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
      displayName: Qualité SonarQube
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: build
  jobs:
  - job: build_image
    displayName: Build et publication de l'image (BuildKit (docker buildx))
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
        echo "$REGISTRY_PASSWORD" | docker login "europe-west9-docker.pkg.dev" -u "$REGISTRY_USER" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
      displayName: Build et publication de l'image (BuildKit (docker buildx))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: security
  jobs:
  - job: gitleaks
    displayName: Recherche de secrets
    pool:
      vmImage: ubuntu-latest
    container: zricethezav/gitleaks:latest
    steps:
    - script: |
        gitleaks detect --source . --verbose
      displayName: Recherche de secrets
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
  - job: trivy
    displayName: Scan de vulnérabilités Trivy
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
      displayName: Scan de vulnérabilités Trivy
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: publish
  jobs:
  - job: cosign
    displayName: Signature de l'image (Cosign)
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
        apk add --no-cache cosign
        echo "$REGISTRY_PASSWORD" | cosign login "europe-west9-docker.pkg.dev" -u "$REGISTRY_USER" --password-stdin
        cosign sign --yes "$IMAGE"
      displayName: Signature de l'image (Cosign)
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: infra
  jobs:
  - job: iac_plan
    displayName: Plan Terraform
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
        cd infra/terraform
        terraform init -input=false
        terraform validate
        terraform plan -input=false -out=plan.tfplan
      displayName: Plan Terraform
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
  - job: iac_apply
    displayName: Application Terraform
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
        cd infra/terraform
        terraform init -input=false
        terraform apply -input=false plan.tfplan
      displayName: Application Terraform
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: deploy_dev
  displayName: Déploiement — Développement
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_dev
    displayName: Déploiement Cloud Run — Développement
    environment: dev
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "$GCP_SA_KEY" > /tmp/gcp-key.json
              export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
              if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
              gcloud run deploy mon-app-dev --image "$IMAGE" --region europe-west9 --project mon-projet
            displayName: Déploiement Cloud Run — Développement
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: deploy_staging
  displayName: Déploiement — Préproduction
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_staging
    displayName: Déploiement Cloud Run — Préproduction
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "$GCP_SA_KEY" > /tmp/gcp-key.json
              export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
              if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
              gcloud run deploy mon-app-staging --image "$IMAGE" --region europe-west9 --project mon-projet
            displayName: Déploiement Cloud Run — Préproduction
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
- stage: deploy_production
  displayName: Déploiement — Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_production
    displayName: Déploiement Cloud Run — Production
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "$GCP_SA_KEY" > /tmp/gcp-key.json
              export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
              if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
              gcloud run deploy mon-app --image "$IMAGE" --region europe-west9 --project mon-projet
            displayName: Déploiement Cloud Run — Production
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
