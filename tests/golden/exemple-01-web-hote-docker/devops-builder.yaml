format_version: 2
name: Site web sur hôte Docker
description: Application Python déployée par Ansible sur un hôte Docker, derrière
  Traefik.
target: docker-host
environments:
- id: production
  label: ''
  kind: production
  approval: false
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
  language: python
  image_name: site-web
  port: 8000
stages:
  source:
  - uid: brique001
    tool: gitlab
    params: {}
  build:
  - uid: brique002
    tool: gitlab-ci
    params: {}
  - uid: brique003
    tool: buildkit
    params: {}
  - uid: brique004
    tool: renovate
    params: {}
  test:
  - uid: brique005
    tool: unit-tests
    params: {}
  - uid: brique006
    tool: sonarqube
    params: {}
  security:
  - uid: brique007
    tool: gitleaks
    params: {}
  - uid: brique008
    tool: trivy
    params: {}
  artifacts:
  - uid: brique009
    tool: harbor
    params:
      url: registry.example.com
  infrastructure:
  - uid: brique010
    tool: ansible
    params: {}
  deploy:
  - uid: brique011
    tool: docker-compose
    params: {}
  platform:
  - uid: brique012
    tool: traefik
    params: {}
  observability:
  - uid: brique013
    tool: prometheus
    params: {}
  - uid: brique014
    tool: grafana
    params: {}
  - uid: brique015
    tool: loki
    params: {}
