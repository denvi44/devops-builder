# Généré par DevOps Builder — à relire avant usage.
stages:
- build
- deploy-dev
- deploy-staging
- deploy-production
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
deploy-dev:
  stage: deploy-dev
  image:
    name: alpine/ansible:latest
    entrypoint:
    - ''
  environment:
    name: dev
  script:
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ansible-galaxy collection install community.docker
  - ansible-playbook -i ansible/inventories/dev.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app-dev"
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-staging:
  stage: deploy-staging
  image:
    name: alpine/ansible:latest
    entrypoint:
    - ''
  environment:
    name: staging
  script:
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ansible-galaxy collection install community.docker
  - ansible-playbook -i ansible/inventories/staging.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app-staging"
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
  - deploy-dev
deploy-production:
  stage: deploy-production
  image:
    name: alpine/ansible:latest
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - ansible-galaxy collection install community.docker
  - ansible-playbook -i ansible/inventories/production.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app"
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - deploy-staging
