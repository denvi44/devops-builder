{{- if .Values.database.azure_database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-azure-database
type: Opaque
stringData:
  url: {{ required "Values.database.azure_database.url : URL de connexion à Azure Database (serveur flexible)" .Values.database.azure_database.url | quote }}
{{- end }}
