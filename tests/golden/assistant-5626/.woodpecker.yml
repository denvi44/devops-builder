# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    DEPLOY_HOST: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    DEPLOY_HOST: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - echo "$$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    DEPLOY_HOST: à-renseigner
- name: deploy
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache openssh-client
  - mkdir -p ~/.ssh && echo "$$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - if [ -n "$${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
  - ssh -o StrictHostKeyChecking=accept-new "$$DEPLOY_HOST" "mkdir -p /opt/mon-app"
  - scp deploy/docker-compose.yml "$$DEPLOY_HOST:/opt/mon-app/docker-compose.yml"
  - echo "$$REGISTRY_PASSWORD" | ssh "$$DEPLOY_HOST" "docker login registry.example.com -u $$REGISTRY_USER --password-stdin"
  - ssh "$$DEPLOY_HOST" "cd /opt/mon-app && IMAGE=$$IMAGE docker compose -p mon-app pull && IMAGE=$$IMAGE docker compose -p mon-app up -d"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    SSH_PRIVATE_KEY:
      from_secret: ssh_private_key
    SONAR_HOST_URL: à-renseigner
    SSH_KNOWN_HOSTS: à-renseigner
    DEPLOY_HOST: à-renseigner
  when:
  - branch: main
    event: push
