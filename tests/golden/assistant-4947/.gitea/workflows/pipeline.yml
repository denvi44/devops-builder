# Gitea Actions reprend la syntaxe GitHub Actions ; vérifier la disponibilité des actions
# tierces et l'émission de jetons OIDC sur votre instance (act_runner).
# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: registry.example.com/mon-app/mon-app:${{ github.sha }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
  OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
  OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  sonarqube:
    name: Qualité SonarQube
    runs-on: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - uses: actions/checkout@v4
    - name: Qualité SonarQube
      run: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  iac-plan:
    name: Plan Terraform
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    steps:
    - uses: actions/checkout@v4
    - &id001
      uses: hashicorp/setup-terraform@v3
    - name: Plan Terraform
      run: |
        cd infra/terraform
        terraform init -input=false
        terraform validate
        terraform plan -input=false -out=plan.tfplan
    - uses: actions/upload-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform/plan.tfplan
  iac-apply:
    name: Application Terraform
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - iac-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - *id001
    - uses: actions/download-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform
    - name: Application Terraform
      run: |
        cd infra/terraform
        terraform init -input=false
        terraform apply -input=false plan.tfplan
  deploy-dev:
    name: Mise à jour GitOps (Argo CD) — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - iac-plan
    - iac-apply
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Développement
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        git commit -am "deploy(dev): mon-app $TAG" && git push origin HEAD
  deploy-staging:
    name: Mise à jour GitOps (Argo CD) — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - iac-plan
    - iac-apply
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Préproduction
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        git commit -am "deploy(staging): mon-app $TAG" && git push origin HEAD
  deploy-production:
    name: Mise à jour GitOps (Argo CD) — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - iac-plan
    - iac-apply
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Production
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        yq -i '.image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        git commit -am "deploy(production): mon-app $TAG" && git push origin HEAD
