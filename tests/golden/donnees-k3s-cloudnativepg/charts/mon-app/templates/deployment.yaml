apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: mon-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mon-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mon-app
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
      - name: migrations
        image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
        command:
        - sh
        - -c
        - npx prisma migrate deploy
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-pg-app'
              key: uri
        securityContext:
          allowPrivilegeEscalation: false
      containers:
        - name: mon-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: '{{ .Release.Name }}-pg-app'
                key: uri
