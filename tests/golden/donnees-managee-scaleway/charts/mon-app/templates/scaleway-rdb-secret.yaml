{{- if .Values.database.scaleway_rdb.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-scaleway-rdb
type: Opaque
stringData:
  url: {{ required "Values.database.scaleway_rdb.url : URL de connexion à Scaleway Managed Database" .Values.database.scaleway_rdb.url | quote }}
{{- end }}
