format_version: 2
name: Modèle Proxmox
description: 'Aucun cloud à payer : une machine virtuelle par environnement, clonée
  d''un modèle cloud-init sur votre Proxmox VE par OpenTofu, configurée par Ansible,
  Docker Compose et Traefik ; secrets chiffrés dans le dépôt (SOPS et age). Le modèle
  de VM (Ubuntu 24.04, qemu-guest-agent) est à préparer une fois, et l''état OpenTofu
  à conserver hors du job (R44).'
target: vm
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
  language: python
  image_name: mon-app
  port: 8000
