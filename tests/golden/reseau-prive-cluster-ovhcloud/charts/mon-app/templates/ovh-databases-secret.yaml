{{- if .Values.database.ovh_databases.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ovh-databases
type: Opaque
stringData:
  url: {{ required "Values.database.ovh_databases.url : URL de connexion à OVHcloud Public Cloud Databases" .Values.database.ovh_databases.url | quote }}
{{- end }}
