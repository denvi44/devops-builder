format_version: 2
name: Modèle OVHcloud instances
description: 'Une instance Public Cloud par environnement, Ansible, Docker Compose
  et Traefik ; secrets chiffrés dans le dépôt (SOPS et age). Pas de pare-feu généré
  : à poser à la main.'
target: vm
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
