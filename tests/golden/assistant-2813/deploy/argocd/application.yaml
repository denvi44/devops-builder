# Généré par DevOps Builder — à relire avant usage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mon-app-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mon-app
    environment: staging
spec:
  project: default
  source:
    repoURL: https://git.example.com/groupe/gitops.git
    targetRevision: main
    path: charts/mon-app
    helm:
      valueFiles:
      - values.yaml
      - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mon-app-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mon-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mon-app
    environment: production
spec:
  project: default
  source:
    repoURL: https://git.example.com/groupe/gitops.git
    targetRevision: main
    path: charts/mon-app
    helm:
      valueFiles:
      - values.yaml
      - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mon-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
