# Généré par DevOps Builder — à relire avant usage. Pour Azure, préférer une connexion de service à fédération d'identité (tâche AzureCLI@2).
trigger:
- main
variables:
  TAG: $(Build.SourceVersion)
  IMAGE: registry.example.com/mon-app/mon-app:$(Build.SourceVersion)
stages:
- stage: test
  jobs:
  - job: unit_tests
    displayName: Tests unitaires
    pool:
      vmImage: ubuntu-latest
    container: python:3.12-slim
    steps:
    - script: |
        pip install -r requirements.txt
        pytest -q
      displayName: Tests unitaires
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
        SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
  - job: sonarqube
    displayName: Qualité SonarQube
    pool:
      vmImage: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - script: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
      displayName: Qualité SonarQube
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
        SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
- stage: build
  jobs:
  - job: build_image
    displayName: Build et publication de l'image (BuildKit (docker buildx))
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        echo "$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
      displayName: Build et publication de l'image (BuildKit (docker buildx))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        REGISTRY_USER: $(REGISTRY_USER)
        REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
        SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
- stage: deploy_dev
  displayName: Déploiement — Développement
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_dev
    displayName: Déploiement Ansible + Compose — Développement
    environment: dev
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
              ansible-galaxy collection install community.docker
              ansible-playbook -i ansible/inventories/dev.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app-dev"
            displayName: Déploiement Ansible + Compose — Développement
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
- stage: deploy_staging
  displayName: Déploiement — Préproduction
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_staging
    displayName: Déploiement Ansible + Compose — Préproduction
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
              ansible-galaxy collection install community.docker
              ansible-playbook -i ansible/inventories/staging.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app-staging"
            displayName: Déploiement Ansible + Compose — Préproduction
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
- stage: deploy_production
  displayName: Déploiement — Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_production
    displayName: Déploiement Ansible + Compose — Production
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
              ansible-galaxy collection install community.docker
              ansible-playbook -i ansible/inventories/production.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app"
            displayName: Déploiement Ansible + Compose — Production
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              SSH_PRIVATE_KEY: $(SSH_PRIVATE_KEY)
