# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - echo "$$SCW_SECRET_KEY" | docker login "rg.fr-par.scw.cloud" -u nologin --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
- name: iac-plan
  image: hashicorp/terraform:1.16
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - export AWS_ACCESS_KEY_ID="$$SCW_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$SCW_SECRET_KEY"
  - cd infra/terraform
  - terraform fmt -check -recursive
  - terraform init -input=false
  - terraform validate
  - terraform plan -input=false -lock-timeout=5m -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
- name: iac-apply
  image: hashicorp/terraform:1.16
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - export AWS_ACCESS_KEY_ID="$$SCW_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$SCW_SECRET_KEY"
  - cd infra/terraform
  - terraform init -input=false
  - terraform apply -input=false -lock-timeout=5m plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="rg.fr-par.scw.cloud/mon-app/mon-app:$$TAG"
  - apk add --no-cache curl bash openssl
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - echo "$$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
  - export KUBECONFIG=/tmp/kubeconfig
  - helm upgrade --install mon-app charts/mon-app --namespace mon-app --create-namespace --set image.repository="$${IMAGE%:*}" --set image.tag="$$TAG" --wait
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SCW_SECRET_KEY:
      from_secret: scw_secret_key
    SCW_ACCESS_KEY:
      from_secret: scw_access_key
    SCW_DEFAULT_PROJECT_ID:
      from_secret: scw_default_project_id
    KUBECONFIG_DATA:
      from_secret: kubeconfig_data
    SONAR_HOST_URL: à-renseigner
  when:
  - branch: main
    event: push
