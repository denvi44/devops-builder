# Généré par DevOps Builder — à relire avant usage.
name: Pipeline matrice
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:${{ github.sha }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  build-image:
    name: Build et publication de l'image (Kaniko)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Build et publication de l'image (Kaniko)
      run: |
        # Kaniko est archivé depuis juin 2025 : préférer BuildKit ou Buildah.
        # Les identifiants du registre se placent dans /kaniko/.docker/config.json.
        /kaniko/executor --context . --dockerfile Dockerfile --destination "$IMAGE"
  deploy:
    name: Déploiement Kustomize
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Déploiement Kustomize
      run: |
        gcloud container clusters get-credentials mon-cluster --region europe-west9 --project mon-projet
        cd deploy/kustomize/overlays/production
        sed -i "s|newTag: .*|newTag: \"$TAG\"|" kustomization.yaml
        kubectl apply -k .
