# Généré par DevOps Builder — à relire avant usage.
# Secrets lus dans OpenBao par External Secrets (ClusterSecretStore « mon-app »).
{{- if not .Values.database.mysql.createSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Release.Name }}-mysql'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: '{{ .Release.Name }}-mysql'
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: '{{ "{{" }} .password {{ "}}" }}'
        url: mysql://app:{{ "{{" }} .password {{ "}}" }}@{{ .Release.Name }}-mysql:3306/app
  data:
  - secretKey: password
    remoteRef:
      key: '{{ .Release.Namespace }}/mysql'
      property: password
{{- end }}
