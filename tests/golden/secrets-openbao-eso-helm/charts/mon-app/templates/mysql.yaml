{{- if .Values.database.mysql.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mysql
type: Opaque
stringData:
  password: {{ required "Values.database.mysql.password : mot de passe de MySQL" .Values.database.mysql.password | quote }}
  url: {{ printf "mysql://app:%s@%s-mysql:3306/app" .Values.database.mysql.password .Release.Name | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Release.Name }}-mysql'
  labels:
    app.kubernetes.io/name: mon-app-mysql
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  selector:
    app.kubernetes.io/name: mon-app-mysql
    app.kubernetes.io/instance: '{{ .Release.Name }}'
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ .Release.Name }}-mysql'
  labels:
    app.kubernetes.io/name: mon-app-mysql
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ .Release.Name }}-mysql'
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mon-app-mysql
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mon-app-mysql
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      containers:
      - name: mysql
        image: '{{ .Values.database.mysql.image }}'
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_USER
          value: app
        - name: MYSQL_DATABASE
          value: app
        - name: MYSQL_RANDOM_ROOT_PASSWORD
          value: 'yes'
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-mysql'
              key: password
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 --silent
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: '{{ .Values.database.mysql.storage }}'
