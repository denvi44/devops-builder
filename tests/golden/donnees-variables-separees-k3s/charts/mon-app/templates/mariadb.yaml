{{- if .Values.database.mariadb.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mariadb
type: Opaque
stringData:
  password: {{ required "Values.database.mariadb.password : mot de passe de MariaDB" .Values.database.mariadb.password | quote }}
  url: {{ printf "mysql://app:%s@%s-mariadb:3306/app" .Values.database.mariadb.password .Release.Name | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Release.Name }}-mariadb'
  labels:
    app.kubernetes.io/name: mon-app-mariadb
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  selector:
    app.kubernetes.io/name: mon-app-mariadb
    app.kubernetes.io/instance: '{{ .Release.Name }}'
  ports:
  - port: 3306
    targetPort: 3306
    name: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ .Release.Name }}-mariadb'
  labels:
    app.kubernetes.io/name: mon-app-mariadb
    app.kubernetes.io/instance: '{{ .Release.Name }}'
spec:
  serviceName: '{{ .Release.Name }}-mariadb'
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mon-app-mariadb
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mon-app-mariadb
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      containers:
      - name: mariadb
        image: '{{ .Values.database.mariadb.image }}'
        ports:
        - containerPort: 3306
          name: mariadb
        env:
        - name: MARIADB_USER
          value: app
        - name: MARIADB_DATABASE
          value: app
        - name: MARIADB_RANDOM_ROOT_PASSWORD
          value: '1'
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-mariadb'
              key: password
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - healthcheck.sh --connect --innodb_initialized
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: '{{ .Values.database.mariadb.storage }}'
