# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - apk add --no-cache aws-cli || true
  - aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: gitleaks
  image: zricethezav/gitleaks:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - gitleaks detect --source . --verbose
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: trivy
  image: aquasec/trivy:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: cosign
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - apk add --no-cache cosign
  - apk add --no-cache aws-cli
  - aws ecr get-login-password --region eu-west-3 | cosign login --username AWS --password-stdin "$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  - cosign sign --yes "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
  when:
  - branch: main
    event: push
- name: iac-plan
  image: ghcr.io/opentofu/opentofu:1.10
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - cd infra/terraform
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
- name: iac-apply
  image: ghcr.io/opentofu/opentofu:1.10
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
  when:
  - branch: main
    event: push
- name: deploy-dev
  image: amazon/aws-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app-dev --force-new-deployment
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
  when:
  - branch: main
    event: push
- name: deploy-staging
  image: amazon/aws-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app-staging --force-new-deployment
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
  when:
  - branch: main
    event: push
- name: deploy-production
  image: amazon/aws-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="$$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$$TAG"
  - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app --force-new-deployment
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    SONAR_HOST_URL: à-renseigner
    AWS_ACCOUNT_ID: à-renseigner
    AWS_ROLE_ARN: à-renseigner
    AWS_REGION: eu-west-3
  when:
  - branch: main
    event: manual
