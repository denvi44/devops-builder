format_version: 2
name: Modèle Azure VM
description: Une machine virtuelle Azure par environnement, Ansible, Docker Compose
  et Traefik ; secrets chiffrés dans le dépôt (SOPS et age).
target: vm
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
