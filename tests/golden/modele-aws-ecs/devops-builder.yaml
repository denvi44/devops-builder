format_version: 2
name: Modèle AWS ECS
description: Conteneurs serverless sur ECS Fargate, ECR, RDS PostgreSQL, Secrets Manager
  ; sans cluster à administrer ; journaux dans CloudWatch ; GitHub Actions connecté
  à AWS par OIDC.
target: docker-host
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
