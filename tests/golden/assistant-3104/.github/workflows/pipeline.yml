# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: monappregistry.azurecr.io/mon-app:${{ github.sha }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  sonarqube:
    name: Qualité SonarQube
    runs-on: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - uses: actions/checkout@v4
    - name: Qualité SonarQube
      run: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$REGISTRY_PASSWORD" | docker login "monappregistry.azurecr.io" -u "$REGISTRY_USER" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  gitleaks:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    container: zricethezav/gitleaks:latest
    steps:
    - uses: actions/checkout@v4
    - name: Recherche de secrets
      run: |
        gitleaks detect --source . --verbose
  trivy:
    name: Scan de vulnérabilités Trivy
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Scan de vulnérabilités Trivy
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$REGISTRY_PASSWORD" | cosign login "monappregistry.azurecr.io" -u "$REGISTRY_USER" --password-stdin
        cosign sign --yes "$IMAGE"
  iac-plan:
    name: Plan OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - name: Plan OpenTofu
      run: |
        cd infra/terraform
        tofu fmt -check -recursive
        tofu init -input=false
        tofu validate
        tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
    - uses: actions/upload-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform/plan.tfplan
  iac-apply:
    name: Application OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: terraform
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - uses: actions/download-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform
    - name: Application OpenTofu
      run: |
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false -lock-timeout=5m plan.tfplan
  deploy-dev:
    name: Mise à jour GitOps (Argo CD) — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    - iac-apply
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Développement
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-dev.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(dev): mon-app $TAG [skip ci]" && git push origin HEAD; fi
  deploy-staging:
    name: Mise à jour GitOps (Argo CD) — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    - iac-apply
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Préproduction
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(staging): mon-app $TAG [skip ci]" && git push origin HEAD; fi
  deploy-production:
    name: Mise à jour GitOps (Argo CD) — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - gitleaks
    - trivy
    - cosign
    - iac-plan
    - iac-apply
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Production
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(production): mon-app $TAG [skip ci]" && git push origin HEAD; fi
