# Généré par DevOps Builder — à relire avant usage. Les secrets se déclarent via availableSecrets (Secret Manager).
steps:
- id: build-image
  name: gcr.io/cloud-builders/docker
  entrypoint: sh
  args:
  - -c
  - |-
    export TAG="$SHORT_SHA"
    export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$SHORT_SHA"
    echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
    export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
    if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
    echo "$$REGISTRY_PASSWORD" | docker login "europe-west9-docker.pkg.dev" -u "$$REGISTRY_USER" --password-stdin
    pack build "$$IMAGE" --builder paketobuildpacks/builder-jammy-base --publish
- id: deploy-staging
  name: google/cloud-sdk:slim
  entrypoint: sh
  args:
  - -c
  - |-
    export TAG="$SHORT_SHA"
    export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$SHORT_SHA"
    echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
    export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
    if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
    gcloud run deploy mon-app-staging --image "$$IMAGE" --region europe-west9 --project mon-projet
options:
  logging: CLOUD_LOGGING_ONLY
