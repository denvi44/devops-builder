# Généré par DevOps Builder — à relire avant usage.
name: 'Pipeline Hybride : hôte Docker puis Kubernetes'
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/boutique:${{ github.sha }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
  DEPLOY_HOST_DEV: ${{ vars.DEPLOY_HOST_DEV }}
  KUBECONFIG_DATA_STAGING: ${{ secrets.KUBECONFIG_DATA_STAGING }}
  KUBECONFIG_DATA_PRODUCTION: ${{ secrets.KUBECONFIG_DATA_PRODUCTION }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  deploy-dev:
    name: Déploiement Docker Compose (SSH) — Développement
    runs-on: ubuntu-latest
    needs:
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Déploiement Docker Compose (SSH) — Développement
      run: |
        mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
        ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST_DEV" "mkdir -p /opt/boutique-dev"
        scp deploy/docker-compose.yml "$DEPLOY_HOST_DEV:/opt/boutique-dev/docker-compose.yml"
        echo "$GITHUB_TOKEN" | ssh "$DEPLOY_HOST_DEV" "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
        ssh "$DEPLOY_HOST_DEV" "cd /opt/boutique-dev && IMAGE=$IMAGE docker compose -p boutique-dev pull && IMAGE=$IMAGE docker compose -p boutique-dev up -d"
  deploy-staging:
    name: Déploiement Helm — Préproduction
    runs-on: ubuntu-latest
    needs:
    - build-image
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Préproduction
      run: |
        echo "$KUBECONFIG_DATA_STAGING" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        helm upgrade --install boutique charts/boutique -f charts/boutique/values-staging.yaml --namespace boutique-staging --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  deploy-production:
    name: Déploiement Helm — Production
    runs-on: ubuntu-latest
    needs:
    - build-image
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Production
      run: |
        echo "$KUBECONFIG_DATA_PRODUCTION" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
        helm upgrade --install boutique charts/boutique -f charts/boutique/values-production.yaml --namespace boutique --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
