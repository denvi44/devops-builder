# Généré par DevOps Builder — à relire avant usage.
name: mon-app
services:
  mon-app:
    image: ${IMAGE:-registry.example.com/mon-app/mon-app:latest}
    restart: unless-stopped
    environment:
      PORT: '8000'
    ports:
    - 8000:8000
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    ports:
    - 5000:5000
  gitea:
    image: gitea/gitea:latest
    ports:
    - 3001:3000
    - '2222:22'
    volumes:
    - gitea-data:/data
volumes:
  gitea-data: {}
