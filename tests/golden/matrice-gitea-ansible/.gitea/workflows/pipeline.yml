# Gitea Actions reprend la syntaxe GitHub Actions ; vérifier la disponibilité des actions
# tierces et l'émission de jetons OIDC sur votre instance (act_runner).
# Généré par DevOps Builder — à relire avant usage.
name: Pipeline matrice
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: registry.example.com/mon-app/mon-app:${{ github.sha }}
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  build-image:
    name: Build et publication de l'image (Buildah)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    container: quay.io/buildah/stable:latest
    steps:
    - uses: actions/checkout@v4
    - name: Build et publication de l'image (Buildah)
      run: |
        echo "$REGISTRY_PASSWORD" | buildah login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
        buildah build --tag "$IMAGE" .
        buildah push "$IMAGE"
  deploy:
    name: Déploiement Ansible + Compose
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Déploiement Ansible + Compose
      run: |
        mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        ansible-galaxy collection install community.docker
        ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app"
