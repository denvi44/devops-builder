# Gitea Actions reprend la syntaxe GitHub Actions ; vérifier la disponibilité des actions
# tierces et l'émission de jetons OIDC sur votre instance (act_runner).
# Généré par DevOps Builder — à relire avant usage.
name: Pipeline matrice
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: registry.example.com/mon-app/mon-app:${{ github.sha }}
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  build-image:
    name: Build et publication de l'image (Buildah)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    container: quay.io/buildah/stable:latest
    steps:
    - uses: actions/checkout@v4
    - name: Build et publication de l'image (Buildah)
      run: |
        echo "$REGISTRY_PASSWORD" | buildah login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
        buildah build --tag "$IMAGE" .
        buildah push "$IMAGE"
  deploy:
    name: Déploiement Ansible + Compose
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
    - uses: actions/checkout@v4
    - name: Déploiement Ansible + Compose
      run: |
        pip install --no-cache-dir "ansible-core>=2.21,<2.22" || pipx install "ansible-core>=2.21,<2.22"
        ansible-galaxy collection install -r ansible/requirements.yml
        mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; fi
        export DEPLOY_REGISTRY="registry.example.com" DEPLOY_REGISTRY_USER="$REGISTRY_USER" DEPLOY_REGISTRY_PASSWORD="$REGISTRY_PASSWORD"
        ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e "image=$IMAGE" -e "project=mon-app" -e "deploy_env=production"
