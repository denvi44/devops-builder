# Généré par DevOps Builder — à relire avant usage. Bases du poste de développement : docker compose -f dev/db/compose.yaml up -d
name: mon-app-dev
services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_PASSWORD: dev
    volumes:
    - mongodb-dev:/data/db
    - ./init/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 20
  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
    - 127.0.0.1:6379:6379
    command:
    - valkey-server
    - --requirepass
    - dev
    volumes:
    - valkey-dev:/data
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli -a "dev" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongodb-dev: {}
  valkey-dev: {}
