# Généré par DevOps Builder — à relire avant usage.
apiVersion: v1
kind: Service
metadata:
  name: gitea-db
  labels:
    app: gitea-db
  namespace: gitea
spec:
  selector:
    app: gitea-db
  ports:
  - port: 3306
    targetPort: 3306
    name: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-db
  labels:
    app: gitea-db
  namespace: gitea
spec:
  serviceName: gitea-db
  replicas: 1
  selector:
    matchLabels:
      app: gitea-db
  template:
    metadata:
      labels:
        app: gitea-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.8
        ports:
        - containerPort: 3306
          name: mariadb
        env:
        - name: MARIADB_USER
          value: gitea
        - name: MARIADB_DATABASE
          value: gitea
        - name: MARIADB_RANDOM_ROOT_PASSWORD
          value: '1'
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitea-db
              key: password
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - healthcheck.sh --connect --innodb_initialized
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
