# Généré par DevOps Builder — à relire avant usage.
apiVersion: v1
kind: Service
metadata:
  name: harbor-db
  labels:
    app: harbor-db
  namespace: harbor
spec:
  selector:
    app: harbor-db
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-db
  labels:
    app: harbor-db
  namespace: harbor
spec:
  serviceName: harbor-db
  replicas: 1
  selector:
    matchLabels:
      app: harbor-db
  template:
    metadata:
      labels:
        app: harbor-db
    spec:
      containers:
      - name: postgresql
        image: postgres:17
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_USER
          value: harbor
        - name: POSTGRES_DB
          value: harbor
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-db
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
