  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - yum install -y -q tar gzip openssl >/dev/null
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - aws eks update-kubeconfig --name mon-cluster --region eu-west-3
  - helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-recette.yaml --namespace mon-app-recette --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
