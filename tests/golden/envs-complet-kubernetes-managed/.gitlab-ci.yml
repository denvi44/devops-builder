# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- security
- publish
- infra
- deploy-sandbox
- deploy-dev
- deploy-recette
- deploy-staging
- deploy-production
- renovate
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$CI_COMMIT_SHORT_SHA
  AWS_REGION: eu-west-3
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache aws-cli || true
  - aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  - docker buildx build --tag "$IMAGE" --push .
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --verbose
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint:
    - ''
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
cosign:
  stage: publish
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache cosign
  - apk add --no-cache aws-cli
  - aws ecr get-login-password --region eu-west-3 | cosign login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  - cosign sign --yes "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
iac-plan:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu fmt -check -recursive
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
  artifacts:
    paths:
    - infra/terraform/plan.tfplan
    expire_in: 1 week
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
iac-apply:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  resource_group: terraform
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false -lock-timeout=5m plan.tfplan
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - iac-plan
deploy-sandbox:
  stage: deploy-sandbox
  image:
    name: amazon/aws-cli:latest
    entrypoint:
    - ''
  environment:
    name: sandbox
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - yum install -y -q tar gzip openssl >/dev/null
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - aws eks update-kubeconfig --name mon-cluster --region eu-west-3
  - helm upgrade --install mon-app charts/mon-app -f charts/mon-app/values-sandbox.yaml --namespace mon-app-sandbox --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-dev:
  stage: deploy-dev
  image:
    name: amazon/aws-cli:latest
    entrypoint:
    - ''
  environment:
    name: dev
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
