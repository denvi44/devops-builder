# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- security
- publish
- infra
- deploy
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: registry.example.com/mon-app/mon-app:$CI_COMMIT_SHORT_SHA
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint:
    - ''
  script:
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --verbose
trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint:
    - ''
  variables:
    TRIVY_USERNAME: $REGISTRY_USER
    TRIVY_PASSWORD: $REGISTRY_PASSWORD
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
cosign:
  stage: publish
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  script:
  - apk add --no-cache cosign
  - echo "$REGISTRY_PASSWORD" | cosign login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
  - cosign sign --yes "$IMAGE"
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
iac-plan:
  stage: infra
  image:
    name: ghcr.io/opentofu/opentofu:1.10
    entrypoint:
    - ''
  script:
  - cd infra/terraform
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -out=plan.tfplan
  artifacts:
    paths:
    - infra/terraform/plan.tfplan
    expire_in: 1 week
iac-apply:
  stage: infra
  image:
    name: ghcr.io/opentofu/opentofu:1.10
    entrypoint:
    - ''
  script:
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false plan.tfplan
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - iac-plan
deploy:
  stage: deploy
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - apk add --no-cache git yq
  - git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
  - cd gitops
  - yq -i '.image.tag = strenv(TAG)' charts/mon-app/values.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'git commit -am "deploy: mon-app $TAG" && git push origin HEAD'
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
