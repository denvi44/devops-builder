# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- security
- publish
- infra
- deploy
- renovate
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: registry.example.com/mon-app/mon-app:$CI_COMMIT_SHORT_SHA
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint:
    - ''
  script:
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --verbose
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint:
    - ''
  variables:
    TRIVY_USERNAME: $REGISTRY_USER
    TRIVY_PASSWORD: $REGISTRY_PASSWORD
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
cosign:
  stage: publish
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  script:
  - apk add --no-cache cosign
  - echo "$REGISTRY_PASSWORD" | cosign login "registry.example.com" -u "$REGISTRY_USER" --password-stdin
  - cosign sign --yes "$IMAGE"
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
iac-plan:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  script:
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - export AWS_ACCESS_KEY_ID="$OVH_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$OVH_S3_SECRET_KEY"
  - cd infra/terraform
  - tofu fmt -check -recursive
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
  artifacts:
    paths:
    - infra/terraform/plan.tfplan
    expire_in: 1 week
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_PIPELINE_SOURCE != "merge_request_event"
iac-apply:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  resource_group: terraform
  script:
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - export AWS_ACCESS_KEY_ID="$OVH_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$OVH_S3_SECRET_KEY"
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false -lock-timeout=5m plan.tfplan
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - iac-plan
deploy:
  stage: deploy
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - apk add --no-cache git yq-go
  - git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
  - cd gitops
  - export IMAGE_NAME="${IMAGE%:*}"
  - yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy: mon-app $TAG [skip ci]" && git push origin HEAD; fi'
  rules:
  - if: $RENOVATE == "1"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
renovate:
  stage: renovate
  image:
    name: renovate/renovate:44.164.5
    entrypoint:
    - ''
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "1"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    LOG_LEVEL: info
  script:
  - renovate
