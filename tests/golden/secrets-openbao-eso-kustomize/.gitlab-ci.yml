# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- security
- publish
- deploy-staging
- deploy-production
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$IMAGE" --push .
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint:
    - ''
  script:
  - gitleaks detect --source . --verbose
trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint:
    - ''
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
cosign:
  stage: publish
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  script:
  - apk add --no-cache cosign
  - echo "$CI_REGISTRY_PASSWORD" | cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  - cosign sign --yes "$IMAGE"
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-staging:
  stage: deploy-staging
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: staging
  script:
  - apk add --no-cache curl bash openssl
  - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
  - echo "$KUBECONFIG_DATA_STAGING" | base64 -d > /tmp/kubeconfig
  - export KUBECONFIG=/tmp/kubeconfig
  - kubectl create namespace mon-app-staging --dry-run=client -o yaml | kubectl apply -f -
  - cd deploy/kustomize/overlays/staging
  - 'sed -i "s|newTag: .*|newTag: \"$TAG\"|" kustomization.yaml'
  - kubectl apply -k .
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-production:
  stage: deploy-production
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  environment:
    name: production
  script:
  - apk add --no-cache curl bash openssl
  - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
  - echo "$KUBECONFIG_DATA_PRODUCTION" | base64 -d > /tmp/kubeconfig
  - export KUBECONFIG=/tmp/kubeconfig
  - kubectl create namespace mon-app --dry-run=client -o yaml | kubectl apply -f -
  - cd deploy/kustomize/overlays/production
  - 'sed -i "s|newTag: .*|newTag: \"$TAG\"|" kustomization.yaml'
  - kubectl apply -k .
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - deploy-staging
