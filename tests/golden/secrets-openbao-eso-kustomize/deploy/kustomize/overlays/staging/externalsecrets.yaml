# Généré par DevOps Builder — à relire avant usage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mon-app-valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mon-app
  target:
    name: mon-app-valkey
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: '{{ .password }}'
        url: redis://:{{ .password }}@mon-app-valkey:6379/0
  data:
  - secretKey: password
    remoteRef:
      key: mon-app-staging/valkey
      property: password
