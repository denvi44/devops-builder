# Généré par DevOps Builder — à relire avant usage.
name: Pipeline matrice
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:${{ github.sha }}
jobs:
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
        docker buildx build --tag "$IMAGE" --push .
  iac-plan:
    name: Plan OpenTofu
    runs-on: ubuntu-latest
    needs:
    - build-image
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - &id001
      uses: opentofu/setup-opentofu@v1
    - name: Plan OpenTofu
      run: |
        cd infra/terraform
        tofu init -input=false
        tofu validate
        tofu plan -input=false -out=plan.tfplan
    - uses: actions/upload-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform/plan.tfplan
  iac-apply:
    name: Application OpenTofu
    runs-on: ubuntu-latest
    needs:
    - build-image
    - iac-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - *id001
    - uses: actions/download-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform
    - name: Application OpenTofu
      run: |
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false plan.tfplan
  deploy:
    name: Déploiement Helm
    runs-on: ubuntu-latest
    needs:
    - build-image
    - iac-plan
    - iac-apply
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm
      run: |
        aws eks update-kubeconfig --name mon-cluster --region eu-west-3
        helm upgrade --install mon-app charts/mon-app --namespace mon-app --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --wait
