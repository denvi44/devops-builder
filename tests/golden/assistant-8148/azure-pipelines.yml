# Généré par DevOps Builder — à relire avant usage. Pour Azure, préférer une connexion de service à fédération d'identité (tâche AzureCLI@2).
trigger:
- main
variables:
  TAG: $(Build.SourceVersion)
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$(Build.SourceVersion)
stages:
- stage: test
  jobs:
  - job: unit_tests
    displayName: Tests unitaires
    pool:
      vmImage: ubuntu-latest
    container: python:3.12-slim
    steps:
    - script: |
        pip install -r requirements.txt
        pytest -q
      displayName: Tests unitaires
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
  - job: sonarqube
    displayName: Qualité SonarQube
    pool:
      vmImage: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - script: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
      displayName: Qualité SonarQube
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: build
  jobs:
  - job: build_image
    displayName: Build et publication de l'image (BuildKit (docker buildx))
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        apk add --no-cache aws-cli || true
        aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
        docker buildx build --tag "$IMAGE" --push .
      displayName: Build et publication de l'image (BuildKit (docker buildx))
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: infra
  jobs:
  - job: iac_plan
    displayName: Plan Terraform
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        cd infra/terraform
        terraform fmt -check -recursive
        terraform init -input=false
        terraform validate
        terraform plan -input=false -lock-timeout=5m -out=plan.tfplan
      displayName: Plan Terraform
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
  - job: iac_apply
    displayName: Application Terraform
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    steps:
    - script: |
        # Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
        cd infra/terraform
        terraform init -input=false
        terraform apply -input=false -lock-timeout=5m plan.tfplan
      displayName: Application Terraform
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)
        GITOPS_TOKEN: $(GITOPS_TOKEN)
- stage: deploy_production
  displayName: Déploiement — Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: deploy_production
    displayName: Mise à jour GitOps (Argo CD)
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              apk add --no-cache git yq-go
              git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
              cd gitops
              export IMAGE_NAME="${IMAGE%:*}"
              yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values.yaml
              git config user.email "ci@example.com" && git config user.name "CI"
              if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy: mon-app $TAG [skip ci]" && git push origin HEAD; fi
            displayName: Mise à jour GitOps (Argo CD)
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              GITOPS_TOKEN: $(GITOPS_TOKEN)
