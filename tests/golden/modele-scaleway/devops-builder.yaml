format_version: 2
name: Modèle Scaleway
description: Kapsule, Container Registry, Managed Database PostgreSQL ; état OpenTofu
  dans Object Storage ; secrets chiffrés dans le dépôt (SOPS et age) ; Prometheus
  et Grafana ; GitLab CI avec les clés d'API de Scaleway.
target: kubernetes-managed
environments:
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
