# Généré par DevOps Builder — à relire avant usage. Activer le mode privilégié du projet CodeBuild (Docker).
version: 0.2
phases:
  build:
    commands:
    - export TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}"
    - export IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$TAG"
    - echo "--- Déploiement ECS — Production"
    - '# Identifiants AWS fournis par AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
    - aws ecs update-service --cluster mon-cluster-ecs --service mon-app --force-new-deployment
artifacts:
  files:
  - '**/*'
  discard-paths: 'no'
