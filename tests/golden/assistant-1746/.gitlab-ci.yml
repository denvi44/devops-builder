# Généré par DevOps Builder — à relire avant usage.
stages:
- test
- build
- infra
- deploy-dev
- deploy-staging
- deploy-production
variables:
  TAG: $CI_COMMIT_SHORT_SHA
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/mon-app:$CI_COMMIT_SHORT_SHA
  AWS_REGION: eu-west-3
unit-tests:
  stage: test
  image:
    name: python:3.12-slim
    entrypoint:
    - ''
  script:
  - pip install -r requirements.txt
  - pytest -q
sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint:
    - ''
  script:
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
build-image:
  stage: build
  image:
    name: docker:27
    entrypoint:
    - ''
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache aws-cli || true
  - aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
  - docker buildx build --tag "$IMAGE" --push .
iac-plan:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu fmt -check -recursive
  - tofu init -input=false
  - tofu validate
  - tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
  artifacts:
    paths:
    - infra/terraform/plan.tfplan
    expire_in: 1 week
iac-apply:
  stage: infra
  image:
    name: alpine:3.20
    entrypoint:
    - ''
  resource_group: terraform
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - apk add --no-cache curl unzip
  - curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
  - unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
  - cd infra/terraform
  - tofu init -input=false
  - tofu apply -input=false -lock-timeout=5m plan.tfplan
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - iac-plan
deploy-dev:
  stage: deploy-dev
  image:
    name: amazon/aws-cli:latest
    entrypoint:
    - ''
  environment:
    name: dev
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app-dev --force-new-deployment
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy-staging:
  stage: deploy-staging
  image:
    name: amazon/aws-cli:latest
    entrypoint:
    - ''
  environment:
    name: staging
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app-staging --force-new-deployment
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
  - deploy-dev
deploy-production:
  stage: deploy-production
  image:
    name: amazon/aws-cli:latest
    entrypoint:
    - ''
  environment:
    name: production
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
  - echo "$AWS_OIDC_TOKEN" > /tmp/aws_oidc_token
  - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws_oidc_token AWS_ROLE_SESSION_NAME=ci
  - aws ecs update-service --cluster mon-cluster-ecs --service mon-app --force-new-deployment
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  needs:
  - deploy-staging
