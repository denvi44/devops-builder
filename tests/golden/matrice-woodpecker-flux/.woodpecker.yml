# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    GITOPS_REPO: à-renseigner
- name: build-image
  image: quay.io/buildah/stable:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - echo "$$REGISTRY_PASSWORD" | buildah login "registry.example.com" -u "$$REGISTRY_USER" --password-stdin
  - buildah build --tag "$$IMAGE" .
  - buildah push "$$IMAGE"
  environment:
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    GITOPS_REPO: à-renseigner
- name: deploy
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="registry.example.com/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq-go
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - export IMAGE_NAME="$${IMAGE%:*}"
  - yq -i '(.images[] | select(.name == "mon-app")) |= (.newName = strenv(IMAGE_NAME) | .newTag = strenv(TAG))' deploy/kustomize/overlays/production/kustomization.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy: mon-app $$TAG [skip ci]" && git push origin HEAD; fi'
  environment:
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    GITOPS_REPO: à-renseigner
  when:
  - branch: main
    event: push
