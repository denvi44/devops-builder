# Généré par DevOps Builder — à relire avant usage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: api
    environment: dev
spec:
  project: default
  source:
    repoURL: https://git.example.com/groupe/gitops.git
    targetRevision: main
    path: charts/api
    helm:
      valueFiles:
      - values.yaml
      - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: api-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
