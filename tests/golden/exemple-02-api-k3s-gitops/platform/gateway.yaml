# Généré par DevOps Builder — à relire avant usage.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: entree
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd
  namespace: argocd
spec:
  parentRefs:
  - name: entree
    namespace: envoy-gateway-system
  hostnames:
  - argocd.example.com
  rules:
  - backendRefs:
    - name: argo-cd-server
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: entree
    namespace: envoy-gateway-system
  hostnames:
  - grafana.example.com
  rules:
  - backendRefs:
    - name: grafana
      port: 80
