# Généré par DevOps Builder — à relire avant usage.
name: Pipeline API sur k3s en GitOps
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/api:${{ github.sha }}
  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        npm ci
        npm test
  semgrep:
    name: Analyse statique Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
    - uses: actions/checkout@v4
    - name: Analyse statique Semgrep
      run: |
        semgrep scan --config auto --error
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  trivy:
    name: Scan de vulnérabilités Trivy
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    container: aquasec/trivy:latest
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - name: Scan de vulnérabilités Trivy
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  syft:
    name: SBOM Syft
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    container: alpine:3.20
    steps:
    - uses: actions/checkout@v4
    - name: SBOM Syft
      run: |
        apk add --no-cache curl
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        syft "$IMAGE" -o spdx-json > sbom.spdx.json
    - uses: actions/upload-artifact@v4
      with:
        name: syft
        path: sbom.spdx.json
  cosign:
    name: Signature de l'image (Cosign)
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    - trivy
    - syft
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Signature de l'image (Cosign)
      run: |
        echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        cosign sign --yes "$IMAGE"
  deploy-dev:
    name: Mise à jour GitOps (Argo CD) — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    - trivy
    - syft
    - cosign
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Développement
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/api/values-dev.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(dev): api $TAG [skip ci]" && git push origin HEAD; fi
  deploy-staging:
    name: Mise à jour GitOps (Argo CD) — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    - trivy
    - syft
    - cosign
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Préproduction
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/api/values-staging.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(staging): api $TAG [skip ci]" && git push origin HEAD; fi
  deploy-production:
    name: Mise à jour GitOps (Argo CD) — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - semgrep
    - build-image
    - trivy
    - syft
    - cosign
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Mise à jour GitOps (Argo CD) — Production
      run: |
        git clone "https://oauth2:$GITOPS_TOKEN@$GITOPS_REPO" gitops
        cd gitops
        export IMAGE_NAME="${IMAGE%:*}"
        yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/api/values-production.yaml
        git config user.email "ci@example.com" && git config user.name "CI"
        if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(production): api $TAG [skip ci]" && git push origin HEAD; fi
