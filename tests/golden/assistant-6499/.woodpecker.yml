# Généré par DevOps Builder — à relire avant usage. Les étapes Docker montent le socket de l'hôte : dépôt de confiance requis.
steps:
- name: unit-tests
  image: python:3.12-slim
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - pip install -r requirements.txt
  - pytest -q
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$$SONAR_HOST_URL -Dsonar.token=$$SONAR_TOKEN
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: build-image
  image: docker:27
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
  - if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
  - echo "$$REGISTRY_PASSWORD" | docker login "europe-west9-docker.pkg.dev" -u "$$REGISTRY_USER" --password-stdin
  - docker buildx build --tag "$$IMAGE" --push .
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: gitleaks
  image: zricethezav/gitleaks:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - gitleaks detect --source . --verbose
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: trivy
  image: aquasec/trivy:latest
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
  - if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
  - trivy image --exit-code 1 --severity HIGH,CRITICAL "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: cosign
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
  - if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
  - apk add --no-cache cosign
  - echo "$$REGISTRY_PASSWORD" | cosign login "europe-west9-docker.pkg.dev" -u "$$REGISTRY_USER" --password-stdin
  - cosign sign --yes "$$IMAGE"
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
  when:
  - branch: main
    event: push
- name: iac-plan
  image: hashicorp/terraform:1.16
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
  - if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
  - cd infra/terraform
  - terraform fmt -check -recursive
  - terraform init -input=false
  - terraform validate
  - terraform plan -input=false -lock-timeout=5m -out=plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
- name: iac-apply
  image: hashicorp/terraform:1.16
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - echo "$$GCP_SA_KEY" > /tmp/gcp-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
  - if command -v gcloud >/dev/null; then gcloud auth activate-service-account --key-file /tmp/gcp-key.json; fi
  - cd infra/terraform
  - terraform init -input=false
  - terraform apply -input=false -lock-timeout=5m plan.tfplan
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-staging
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq-go
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - export IMAGE_NAME="$${IMAGE%:*}"
  - yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-staging.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(staging): mon-app $$TAG [skip ci]" && git push origin HEAD; fi'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
  when:
  - branch: main
    event: push
- name: deploy-production
  image: alpine:3.20
  commands:
  - export TAG="${CI_COMMIT_SHA:0:8}"
  - export IMAGE="europe-west9-docker.pkg.dev/mon-projet/mon-app/mon-app:$$TAG"
  - apk add --no-cache git yq-go
  - git clone "https://oauth2:$$GITOPS_TOKEN@$$GITOPS_REPO" gitops
  - cd gitops
  - export IMAGE_NAME="$${IMAGE%:*}"
  - yq -i '.image.repository = strenv(IMAGE_NAME) | .image.tag = strenv(TAG)' charts/mon-app/values-production.yaml
  - git config user.email "ci@example.com" && git config user.name "CI"
  - 'if git diff --quiet; then echo "Image déjà en place"; else git commit -am "deploy(production): mon-app $$TAG [skip ci]" && git push origin HEAD; fi'
  environment:
    SONAR_TOKEN:
      from_secret: sonar_token
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    GITOPS_TOKEN:
      from_secret: gitops_token
    SONAR_HOST_URL: à-renseigner
    GITOPS_REPO: à-renseigner
    GCP_WORKLOAD_IDENTITY_PROVIDER: à-renseigner
    GCP_SERVICE_ACCOUNT: à-renseigner
    GCP_INFRA_SERVICE_ACCOUNT: à-renseigner
  when:
  - branch: main
    event: manual
