# Généré par DevOps Builder — à relire avant usage.
name: Pipeline IaC AWS et Floci
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com/boutique:${{ github.sha }}
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
  TF_VAR_vpc_id: ${{ vars.TF_VAR_vpc_id }}
  TF_VAR_subnet_ids: ${{ vars.TF_VAR_subnet_ids }}
  TF_VAR_db_subnet_group: ${{ vars.TF_VAR_db_subnet_group }}
  TF_VAR_db_security_group_ids: ${{ vars.TF_VAR_db_security_group_ids }}
  DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
  DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    services:
      floci:
        image: floci/floci:2.2.0
        env:
          FLOCI_HOSTNAME: floci
          FLOCI_DEFAULT_REGION: eu-west-3
        ports:
        - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-3
      AWS_REGION: eu-west-3
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  tflint:
    name: Analyse TFLint
    runs-on: ubuntu-latest
    container: ghcr.io/terraform-linters/tflint:latest
    steps:
    - uses: actions/checkout@v4
    - name: Analyse TFLint
      run: |
        tflint --chdir=infra/terraform --init
        tflint --chdir=infra/terraform --format compact
  infracost:
    name: Estimation des coûts Infracost
    runs-on: ubuntu-latest
    container: infracost/infracost:ci-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Estimation des coûts Infracost
      run: |
        infracost breakdown --path infra/terraform --format table
  iac-floci:
    name: Plan de l'IaC sur Floci (émulateur AWS)
    runs-on: ubuntu-latest
    container: alpine:3.20
    continue-on-error: true
    services:
      floci:
        image: floci/floci:2.2.0
        env:
          FLOCI_HOSTNAME: floci
          FLOCI_DEFAULT_REGION: eu-west-3
        ports:
        - 4566:4566
    env:
      FLOCI_ENDPOINT: http://floci:4566
    steps:
    - uses: actions/checkout@v4
    - name: Plan de l'IaC sur Floci (émulateur AWS)
      run: |
        apk add --no-cache curl unzip
        curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip"
        unzip -o -q /tmp/tofu.zip tofu -d /usr/local/bin
        apk add --no-cache bash curl
        bash scripts/tf-floci.sh plan
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - tflint
    - infracost
    - iac-floci
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.eu-west-3.amazonaws.com"
        docker buildx build --tag "$IMAGE" --push .
  iac-plan:
    name: Plan OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - tflint
    - infracost
    - iac-floci
    - build-image
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - name: Plan OpenTofu
      run: |
        cd infra/terraform
        tofu fmt -check -recursive
        tofu init -input=false
        tofu validate
        tofu plan -input=false -lock-timeout=5m -out=plan.tfplan
    - uses: actions/upload-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform/plan.tfplan
  iac-apply:
    name: Application OpenTofu
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - tflint
    - infracost
    - iac-floci
    - build-image
    - iac-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: terraform
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.13.1
    - uses: actions/download-artifact@v4
      with:
        name: iac-plan
        path: infra/terraform
    - name: Application OpenTofu
      run: |
        cd infra/terraform
        tofu init -input=false
        tofu apply -input=false -lock-timeout=5m plan.tfplan
  deploy-staging:
    name: Déploiement Helm — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - tflint
    - infracost
    - iac-floci
    - build-image
    - iac-plan
    - iac-apply
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Préproduction
      run: |
        aws eks update-kubeconfig --name boutique --region eu-west-3
        helm upgrade --install boutique charts/boutique -f charts/boutique/values-staging.yaml --namespace boutique-staging --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --set-string database.aws_rds.url="$DATABASE_URL_STAGING" --wait
  deploy-production:
    name: Déploiement Helm — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - tflint
    - infracost
    - iac-floci
    - build-image
    - iac-plan
    - iac-apply
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: eu-west-3
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
    - uses: azure/setup-helm@v4
    - name: Déploiement Helm — Production
      run: |
        aws eks update-kubeconfig --name boutique --region eu-west-3
        helm upgrade --install boutique charts/boutique -f charts/boutique/values-production.yaml --namespace boutique --create-namespace --set image.repository="${IMAGE%:*}" --set image.tag="$TAG" --set-string database.aws_rds.url="$DATABASE_URL_PRODUCTION" --wait
