# Gitea Actions reprend la syntaxe GitHub Actions ; vérifier la disponibilité des actions
# tierces et l'émission de jetons OIDC sur votre instance (act_runner).
# Généré par DevOps Builder — à relire avant usage.
name: Pipeline Mon projet
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
  id-token: write
  packages: write
env:
  TAG: ${{ github.sha }}
  IMAGE: monappregistry.azurecr.io/mon-app:${{ github.sha }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
    - uses: actions/checkout@v4
    - name: Tests unitaires
      run: |
        pip install -r requirements.txt
        pytest -q
  sonarqube:
    name: Qualité SonarQube
    runs-on: ubuntu-latest
    container: sonarsource/sonar-scanner-cli:latest
    steps:
    - uses: actions/checkout@v4
    - name: Qualité SonarQube
      run: |
        sonar-scanner -Dsonar.projectKey=mon-app -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  build-image:
    name: Build et publication de l'image (BuildKit (docker buildx))
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: docker/setup-buildx-action@v3
    - name: Build et publication de l'image (BuildKit (docker buildx))
      run: |
        echo "$REGISTRY_PASSWORD" | docker login "monappregistry.azurecr.io" -u "$REGISTRY_USER" --password-stdin
        docker buildx build --tag "$IMAGE" --push .
  deploy-dev:
    name: Déploiement Azure Container Apps — Développement
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Déploiement Azure Container Apps — Développement
      run: |
        az containerapp update --name mon-app-dev --resource-group rg-mon-app --image "$IMAGE"
  deploy-staging:
    name: Déploiement Azure Container Apps — Préproduction
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Déploiement Azure Container Apps — Préproduction
      run: |
        az containerapp update --name mon-app-staging --resource-group rg-mon-app --image "$IMAGE"
  deploy-production:
    name: Déploiement Azure Container Apps — Production
    runs-on: ubuntu-latest
    needs:
    - unit-tests
    - sonarqube
    - build-image
    - deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Déploiement Azure Container Apps — Production
      run: |
        az containerapp update --name mon-app --resource-group rg-mon-app --image "$IMAGE"
