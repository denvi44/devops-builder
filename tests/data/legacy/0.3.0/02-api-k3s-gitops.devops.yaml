format_version: 2
name: API sur k3s en GitOps
description: API Node.js construite sur GitHub, signée, promue dev → préprod → production
  par Argo CD sur k3s.
target: kubernetes
environments:
- id: dev
  label: ''
  kind: dev
  approval: false
  cluster: null
  overrides: {}
- id: staging
  label: ''
  kind: staging
  approval: false
  cluster: null
  overrides: {}
- id: production
  label: ''
  kind: production
  approval: true
  cluster: null
  overrides: {}
secnumcloud: false
cloud_auth: oidc
license_policy: any
app:
  language: node
  image_name: api
  port: 3000
