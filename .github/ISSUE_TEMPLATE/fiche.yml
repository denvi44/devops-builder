name: Fiche d'outil
description: Proposer un outil du CNCF Landscape, corriger une fiche ou demander qu'un générateur le prenne en charge.
labels: [catalogue]
body:
  - type: input
    id: outil
    attributes:
      label: Outil
      description: Nom tel qu'il apparaît dans le CNCF Landscape.
    validations:
      required: true
  - type: dropdown
    id: demande
    attributes:
      label: Demande
      options:
        - Nouvelle fiche
        - Correction d'une fiche (licence, cycle de vie, dépôt…)
        - Prise en charge par un générateur (aujourd'hui « à configurer à la main » ou « expérimental »)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Détails
      description: Étape du pipeline, cibles d'hébergement, ce que les fichiers générés devraient contenir, sources.
    validations:
      required: true
