# Site de documentation : construit à chaque modification (liens et pages vérifiés), publié sur GitHub Pages
# depuis main. Une fois : Settings → Pages → Source « GitHub Actions ».
name: Documentation

on:
  push:
    branches: [main, "lot-*"]
    paths: [docs/**, mkdocs.yml, .github/workflows/documentation.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construction:
    name: Construction du site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
      - name: Construction stricte (liens et pages manquants refusés)
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  publication:
    name: Publication sur GitHub Pages
    needs: construction
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
