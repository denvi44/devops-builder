# Publication d'une version de DevOps Builder : paquet PyPI, exécutables Windows, macOS et Linux,
# attestations de provenance, étiquette et page de publication GitHub. Aucune étiquette à créer à la main :
# Actions → Publication → Run workflow, version X.Y.Z (celle de pyproject.toml et du journal).
# Poussé sur une branche, le workflow ne fait qu'un essai : il construit et éprouve, sans rien publier.
name: Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z, déjà dans pyproject.toml et CHANGELOG.md)"
        required: true
      publier:
        description: "Publier (décoché : construire et éprouver seulement)"
        type: boolean
        default: true
  push:
    branches-ignore: [main]
    paths:
      - packaging/**
      - pyproject.toml
      - tools/publication.py
      - .github/workflows/publication.yml

permissions: {}

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  # publication réelle seulement à la demande, depuis main
  PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier && github.ref == 'refs/heads/main' }}

jobs:
  verification:
    name: Version, journal et tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publier: ${{ env.PUBLIER }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Version
        id: version
        env:
          DEMANDEE: ${{ inputs.version }}
        run: |
          version="${DEMANDEE:-$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python tools/publication.py verifier "$version"
      - name: Étiquette encore libre
        if: env.PUBLIER == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION"; then
            echo "::error::l'étiquette v$VERSION existe déjà"; exit 1
          fi
      - name: Notes de publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/publication.py notes "$VERSION" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
      - name: Bibliothèques système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  paquet:
    name: Paquet Python
    needs: verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "build>=1.2" "twine>=6.1"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Installation de la roue dans un environnement neuf
        env:
          VERSION: ${{ needs.verification.outputs.version }}
        run: |
          python -m venv /tmp/essai
          /tmp/essai/bin/pip install dist/*.whl
          test "$(/tmp/essai/bin/devops-builder --version)" = "devops-builder $VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.verification.outputs.publier == 'true'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquet
          path: dist/
          if-no-files-found: error

  executables:
    name: Exécutable ${{ matrix.cible }}
    needs: verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - cible: linux-x86_64
            os: ubuntu-22.04   # glibc 2.35 : l'exécutable tourne aussi sur les distributions de 2022
          - cible: windows-x86_64
            os: windows-2025
          - cible: macos-arm64
            os: macos-15
          - cible: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verification.outputs.version }}
      ARCHIVE: devops-builder-${{ needs.verification.outputs.version }}-${{ matrix.cible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Bibliothèques système de Qt
        if: runner.os == 'Linux'
        # libxcb-cursor0 : demandée par le greffon xcb de Qt 6.5+, embarquée dans l'exécutable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install . "pyinstaller==6.22.3"
      - name: Construction
        working-directory: packaging
        run: pyinstaller --noconfirm --log-level WARN devops-builder.spec
      - name: Essai
        run: |
          case "$RUNNER_OS" in
            Windows) exe=packaging/dist/devops-builder/devops-builder.exe ;;
            macOS) exe="packaging/dist/DevOps Builder.app/Contents/MacOS/devops-builder" ;;
            *) exe=packaging/dist/devops-builder/devops-builder ;;
          esac
          python packaging/essai.py "$exe" "$VERSION"
      - name: Archive
        working-directory: packaging/dist
        run: |
          mkdir -p ../../sortie
          case "$RUNNER_OS" in
            Windows) 7z a -tzip -bso0 "../../sortie/$ARCHIVE.zip" devops-builder ;;
            macOS) ditto -c -k --keepParent "DevOps Builder.app" "../../sortie/$ARCHIVE.zip" ;;
            *) tar -czf "../../sortie/$ARCHIVE.tar.gz" devops-builder ;;
          esac
          ls -l ../../sortie
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.verification.outputs.publier == 'true'
        with:
          subject-path: sortie/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ matrix.cible }}
          path: sortie/
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: [verification, paquet, executables]
    if: needs.verification.outputs.publier == 'true'
    runs-on: ubuntu-24.04
    # publication de confiance : PyPI reconnaît ce workflow et cet environnement, aucun mot de passe stocké
    environment:
      name: pypi
      url: https://pypi.org/project/izinum-devops-builder/${{ needs.verification.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquet
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github:
    name: Étiquette et publication GitHub
    needs: [verification, pypi]
    if: needs.verification.outputs.publier == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verification.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefacts/
      - name: Sommes de contrôle
        run: |
          mkdir sortie
          find artefacts/paquet artefacts/executable-* -type f -exec mv {} sortie/ \;
          (cd sortie && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publication
        run: |
          gh release create "v$VERSION" sortie/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DevOps Builder $VERSION" --notes-file artefacts/notes/notes.md
