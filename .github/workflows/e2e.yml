# Tests de bout en bout : les fichiers générés exécutés pour de vrai (tools/e2e/run.py).
name: Bout en bout

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Un seul scénario (vide = tous)
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - devops_builder/**
      - tools/e2e/**
      - .github/workflows/e2e.yml

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.scenario }}
  cancel-in-progress: true

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - kind-helm-cnpg
          - kind-kustomize-postgresql
          - compose-postgresql
          - compose-zabbix
          - compose-sops
          - compose-zap
          - compose-dex
          - gitea-renovate
          - compose-identite-keycloak
          - kind-argocd
          - kind-plateforme
          - kind-coffre-openbao
          - kind-identite-keycloak
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: kind (compilé depuis ses sources, vérifiées par la base de sommes de Go)
        if: startsWith(matrix.scenario, 'kind-') && (inputs.scenario == '' || inputs.scenario == matrix.scenario)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: kubeconform (rendu des charts de plateforme)
        if: matrix.scenario == 'kind-plateforme' && (inputs.scenario == '' || inputs.scenario == matrix.scenario)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: contains(matrix.scenario, 'identite')
        with:
          tofu_wrapper: false
      - name: age (SOPS)
        if: contains(matrix.scenario, 'sops')
        # sops du poste de l'opérateur (secrets-seed.sh) ; la CI générée installe le sien, vérifié, dans $HOME
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - name: Versions des outils
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          if [ "${SCENARIO#kind-}" != "$SCENARIO" ]; then kind version; kubectl version --client; helm version; fi
      - name: Scénario
        if: inputs.scenario == '' || inputs.scenario == matrix.scenario
        run: python tools/e2e/run.py "$SCENARIO"
