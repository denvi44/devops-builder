envoy-gateway:  {80: "HTTP", 443: "HTTPS"}
prometheus:     {9090: "interface et API"}
grafana:        {3000: "interface web"}
loki:           {3100: "API HTTP (ingestion et requêtes)"}
tempo:          {3200: "API HTTP"}
jaeger:         {16686: "interface web", 4317: "OTLP gRPC", 4318: "OTLP HTTP"}
otel-collector: {4317: "OTLP gRPC", 4318: "OTLP HTTP"}
opensearch:     {9200: "API REST"}
fluent-bit:     {24224: "entrée forward"}
fluentd:        {24224: "entrée forward"}
minio:          {9000: "API S3", 9001: "console web"}
zot:            {5000: "registre OCI"}
distribution:   {5000: "registre OCI"}
