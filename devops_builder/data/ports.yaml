# Ports d'écoute par défaut des briques (ports du conteneur), avec leur usage.
# Sert à la vue « Ports », au rapport PIPELINE.md et à la détection des conflits.
# Les ports publiés sur un hôte Docker viennent des services Compose (generators/platform.py).
traefik:        {80: "HTTP", 443: "HTTPS"}
