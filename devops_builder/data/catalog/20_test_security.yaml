# Fiches : tests, qualité et sécurité. Vérifiées le 2026-10-08.

- id: unit-tests
  name: Tests unitaires
  stage: test
  roles: [unit-tests]
  description: Lance les tests du langage du projet (pytest, npm test, mvn verify, go test, dotnet test).
  license: MIT
  repo: ""
  hosting: [ci]
  curated: true
  verified: "2026-10-08"

- id: sonarqube
  name: SonarQube
  multi: true
  stage: test
  extra_stages: [security]
  roles: [code-quality]
  description: Qualité de code et analyse statique. PostgreSQL requis en production ; l'édition gratuite n'analyse ni les branches ni les merge requests.
  homepage: https://www.sonarsource.com/products/sonarqube/
  license: LGPL-3.0
  repo: https://github.com/SonarSource/sonarqube
  hosting: [docker-host, vm, kubernetes]
  verified: "2026-10-08"

- id: sonarqube-cloud
  name: SonarQube Cloud
  stage: test
  support: manual
  support_note: "Analyse à brancher à la main dans la CI."
  extra_stages: [security]
  roles: [code-quality]
  description: Version SaaS de SonarQube.
  license: proprietary
  hosting: [saas]
  verified: "2026-10-08"

- id: semgrep
  name: Semgrep CE
  stage: test
  extra_stages: [security]
  roles: [sast]
  description: Analyse statique de sécurité par motifs.
  license: LGPL-2.1
  repo: https://github.com/semgrep/semgrep
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: litmus
  name: LitmusChaos
  stage: test
  roles: [chaos]
  description: Ingénierie du chaos sur Kubernetes.
  license: Apache-2.0
  hosting: [kubernetes]
  landscape_name: Litmus
  verified: "2026-10-08"

- id: chaos-mesh
  name: Chaos Mesh
  stage: test
  roles: [chaos]
  description: Ingénierie du chaos sur Kubernetes.
  license: Apache-2.0
  hosting: [kubernetes]
  verified: "2026-10-08"

# ---------------------------------------------------------------- Sécurité
- id: trivy
  name: Trivy
  stage: security
  extra_stages: [test]
  roles: [vuln-scan, iac-scan]
  description: Scan de vulnérabilités (images, système de fichiers) et de configuration IaC.
  license: Apache-2.0
  hosting: [ci, cli, kubernetes]
  provides: [vuln-scan]
  verified: "2026-10-08"

- id: grype
  name: Grype
  stage: security
  extra_stages: [test]
  roles: [vuln-scan]
  description: Scan de vulnérabilités d'images et de systèmes de fichiers.
  license: Apache-2.0
  repo: https://github.com/anchore/grype
  hosting: [ci, cli]
  provides: [vuln-scan]
  verified: "2026-10-08"

- id: tflint
  name: TFLint
  stage: test
  extra_stages: [security]
  roles: [iac-lint]
  description: Linter Terraform et OpenTofu (erreurs de syntaxe, conventions, arguments dépréciés) ; règles propres à chaque cloud par extension.
  homepage: https://github.com/terraform-linters/tflint
  license: MPL-2.0
  repo: https://github.com/terraform-linters/tflint
  hosting: [ci, cli]
  verified: "2026-10-11"

- id: infracost
  name: Infracost
  stage: test
  roles: [cost-estimation]
  description: Estimation du coût mensuel de l'infrastructure Terraform ou OpenTofu, avant l'apply. Clé d'API gratuite requise.
  homepage: https://www.infracost.io/
  license: Apache-2.0
  repo: https://github.com/infracost/infracost
  hosting: [ci, cli]
  verified: "2026-10-11"

- id: floci
  name: Floci
  stage: test
  support: experimental
  support_note: "Dans la CI, le plan passe ; EKS, RDS et Lambda ne se créent qu'en local, et un apply échoue sur les réseaux existants."
  extra_stages: [infrastructure]
  roles: [cloud-emulator]
  description: Émulateur AWS local (S3, SQS, DynamoDB, Lambda, IAM, RDS, EKS…), alternative libre à LocalStack. Tests de l'application et plan de l'IaC sans compte AWS, en local et dans la CI.
  homepage: https://floci.io/
  license: MIT
  repo: https://github.com/floci-io/floci
  hosting: [ci, cli, docker-host]
  verified: "2026-10-11"

- id: checkov
  name: Checkov
  stage: security
  extra_stages: [test]
  roles: [iac-scan]
  description: Analyse de configuration IaC (Terraform, Kubernetes, Helm…).
  license: Apache-2.0
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: kics
  name: KICS
  stage: security
  extra_stages: [test]
  roles: [iac-scan]
  description: Analyse de configuration IaC par Checkmarx.
  license: Apache-2.0
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: gitleaks
  name: Gitleaks
  stage: security
  extra_stages: [test]
  roles: [secret-scan]
  description: Détection de secrets dans le dépôt Git.
  license: MIT
  repo: https://github.com/gitleaks/gitleaks
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: syft
  name: Syft
  stage: security
  extra_stages: [artifacts]
  roles: [sbom]
  description: Génère un SBOM (SPDX, CycloneDX) d'une image.
  license: Apache-2.0
  repo: https://github.com/anchore/syft
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: cosign
  name: Cosign
  stage: security
  extra_stages: [artifacts]
  roles: [signing]
  description: Signature d'images (projet Sigstore), sans clé via OIDC en CI.
  license: Apache-2.0
  hosting: [ci, cli]
  requires: [registry-oci]
  landscape_name: sigstore
  verified: "2026-10-08"

- id: snyk
  name: Snyk
  stage: security
  extra_stages: [test]
  roles: [vuln-scan, sast]
  description: Plateforme SaaS de sécurité applicative.
  license: proprietary
  hosting: [saas, ci]
  provides: [vuln-scan]
  verified: "2026-10-08"

- id: kubescape
  name: Kubescape
  stage: security
  extra_stages: [platform]
  roles: [k8s-posture]
  description: Posture de sécurité Kubernetes (manifestes, clusters).
  license: Apache-2.0
  hosting: [ci, cli, kubernetes]
  verified: "2026-10-08"

- id: zap
  name: ZAP (OWASP)
  stage: security
  extra_stages: [test]
  roles: [dast]
  description: Analyse dynamique (DAST) d'une application déployée ; scan de base, complet ou d'API.
  license: Apache-2.0
  repo: https://github.com/zaproxy/zaproxy
  hosting: [ci, docker-host]
  verified: "2026-10-14"

- id: burp-suite
  name: Burp Suite DAST
  stage: security
  extra_stages: [test]
  support: manual
  support_note: "Commercial, non testable dans la CI publique du projet ; ZAP est l'alternative libre."
  roles: [dast]
  description: Analyse dynamique (DAST) de PortSwigger, lancée depuis la CI par son pilote ; licence payante.
  license: proprietary
  hosting: [saas, ci]
  alternatives: [zap]
  verified: "2026-10-14"
