# Fiches fournisseurs cloud. Un service managé (EKS, ECR…) exige que son
# fournisseur soit présent dans le pipeline (règle R09).
# Vérifiées le 2026-10-08.

- id: aws
  name: Amazon Web Services
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Fournisseur cloud AWS.
  license: proprietary
  hosting: [saas]
  terraform_provider: hashicorp/aws
  auth: [oidc, static]
  secnumcloud: "no"
  services:
    k8s.managed: eks
    registry: ecr
    secrets: aws-secrets-manager
    object-storage: s3
    observability: cloudwatch
    containers: ecs-fargate
    ci: aws-codebuild
    scm: codecommit
  params: {region: eu-west-3, role_arn: "arn:aws:iam::123456789012:role/ci-deploy"}
  verified: "2026-10-08"

- id: gcp
  name: Google Cloud
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Fournisseur cloud Google.
  license: proprietary
  hosting: [saas]
  terraform_provider: hashicorp/google
  auth: [oidc, static]
  secnumcloud: "no"
  services:
    k8s.managed: gke
    registry: artifact-registry
    secrets: gcp-secret-manager
    object-storage: gcs
    observability: cloud-monitoring
    containers: cloud-run
    ci: google-cloud-build
    scm: secure-source-manager
  params:
    project_id: mon-projet
    region: europe-west9
    workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/ci/providers/gitlab
    service_account: ci-deploy@mon-projet.iam.gserviceaccount.com
  verified: "2026-10-08"

- id: azure
  name: Microsoft Azure
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Fournisseur cloud Microsoft.
  license: proprietary
  hosting: [saas]
  terraform_provider: hashicorp/azurerm
  auth: [oidc, static]
  secnumcloud: "no"
  services:
    k8s.managed: aks
    registry: acr
    secrets: azure-key-vault
    object-storage: azure-blob
    observability: azure-monitor
    containers: azure-container-apps
    ci: azure-pipelines
    scm: azure-repos
  params: {location: francecentral, resource_group: rg-mon-projet}
  verified: "2026-10-08"

- id: ovhcloud
  name: OVHcloud
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Fournisseur cloud français. Bare Metal Pod qualifié SecNumCloud 3.2 (mars 2025) ; qualification du Public Cloud annoncée, statut à vérifier.
  license: proprietary
  hosting: [saas]
  terraform_provider: ovh/ovh
  auth: [static]
  secnumcloud: partial
  services:
    k8s.managed: ovh-mks
    registry: ovh-registry
    object-storage: ovh-object-storage
  params: {service_name: "<id-projet-public-cloud>", endpoint: ovh-eu}
  verified: "2026-10-08"

- id: outscale
  name: Outscale
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Cloud de Dassault Systèmes, cloud public qualifié SecNumCloud 3.2.
  license: proprietary
  hosting: [saas]
  terraform_provider: outscale/outscale
  auth: [static]
  secnumcloud: "yes"
  services:
    k8s.managed: oks
  params: {region: eu-west-2}
  verified: "2026-10-08"

- id: scaleway
  name: Scaleway
  kind: provider
  stage: infrastructure
  roles: [cloud-provider]
  description: Fournisseur cloud français.
  license: proprietary
  hosting: [saas]
  terraform_provider: scaleway/scaleway
  auth: [static]
  secnumcloud: unknown
  services:
    k8s.managed: kapsule
    registry: scaleway-registry
    object-storage: scaleway-object-storage
  params: {region: fr-par, zone: fr-par-1}
  verified: "2026-10-08"
