# Capacité « chiffrement (KMS) » : une clé par cloud (Outscale : pas de brique ; le KMS d'OVHcloud se commande hors de la pile).
# Chez AWS la clé est utilisée par les ressources du projet ; ailleurs elle est créée et donnée en sortie. Vérifiées le 2026-10-21.

- id: aws-kms
  name: AWS Key Management Service (KMS)
  kind: service
  stage: infrastructure
  roles: [kms]
  description: "Clé de chiffrement à rotation automatique, utilisée pour les disques, Amazon RDS, ElastiCache, SQS et les secrets du projet."
  homepage: https://aws.amazon.com/kms/
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [kms]
  provider: aws
  verified: "2026-10-21"

