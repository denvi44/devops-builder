# Capacité « cache managé » : une brique par cloud qui en propose un (Outscale n'en a pas).
# Le cache est une base managée de la famille clé-valeur : même contrat de connexion (REDIS_URL, secret de la CI
# ou du coffre du cloud). Vérifiées le 2026-10-21.

- id: aws-elasticache
  name: Amazon ElastiCache (Valkey)
  kind: service
  stage: data
  extra_stages: [infrastructure]
  roles: [database, key-value-store, managed-cache]
  description: "Cache Valkey managé par AWS : groupe de réplication chiffré, jeton d'authentification généré, sous-réseaux privés du projet."
  homepage: https://aws.amazon.com/elasticache/
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [database, key-value]
  provider: aws
  verified: "2026-10-21"

