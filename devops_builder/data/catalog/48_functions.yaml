# Capacité « fonctions serverless » : une brique par cloud (OVHcloud annonce son offre, Outscale n'en a pas).
# La fonction est créée par environnement avec un code de remplacement ; la CI déploie le vrai code. Vérifiées le 2026-10-21.

- id: aws-lambda
  name: AWS Lambda
  kind: service
  stage: deploy
  extra_stages: [infrastructure]
  roles: [deploy, serverless-functions]
  description: "Fonction Lambda par environnement avec son rôle IAM, une URL HTTPS publique et un déploiement du code par la CI."
  homepage: https://aws.amazon.com/lambda/
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [serverless-functions]
  provider: aws
  verified: "2026-10-21"

