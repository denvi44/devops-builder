  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: azure
  verified: "2026-10-11"

- id: scaleway-instance
  name: Scaleway Instances
  kind: service
  stage: infrastructure
  roles: [compute]
  description: Machines virtuelles Scaleway, hébergées en France, aux Pays-Bas ou en Pologne. Créées par Terraform ou OpenTofu, un groupe par environnement (ou par hôte partagé) ; leurs adresses alimentent l'inventaire Ansible ou le déploiement SSH.
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: scaleway
  verified: "2026-10-11"

- id: ovh-instance
  name: OVHcloud Public Cloud Instances
  kind: service
  stage: infrastructure
  roles: [compute]
  description: Machines virtuelles OVHcloud Public Cloud. Créées par Terraform ou OpenTofu, un groupe par environnement (ou par hôte partagé) ; leurs adresses alimentent l'inventaire Ansible ou le déploiement SSH.
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: ovhcloud
  verified: "2026-10-11"

- id: outscale-vm
  name: Outscale VM
  kind: service
  stage: infrastructure
  roles: [compute]
  description: Machines virtuelles Outscale, cloud qualifié SecNumCloud. Créées par Terraform ou OpenTofu, un groupe par environnement (ou par hôte partagé) ; leurs adresses alimentent l'inventaire Ansible ou le déploiement SSH.
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: outscale
  verified: "2026-10-11"

