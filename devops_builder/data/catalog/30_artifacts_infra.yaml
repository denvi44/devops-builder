# Fiches : registres, IaC, clusters, fournisseurs cloud et services managés.
# Vérifiées le 2026-10-08.

# ----------------------------------------------------------------- Registres
- id: harbor
  name: Harbor
  stage: artifacts
  roles: [registry]
  description: Registre OCI autohébergé avec RBAC, réplication et scanner Trivy intégré.
  license: Apache-2.0
  hosting: [docker-host, vm, kubernetes]
  provides: [registry-oci, vuln-scan-embedded]
  verified: "2026-10-08"

- id: zot
  name: zot
  stage: artifacts
  roles: [registry]
  description: Registre OCI natif, léger.
  license: Apache-2.0
  hosting: [docker-host, vm, kubernetes]
  provides: [registry-oci]
  verified: "2026-10-08"

- id: distribution
  name: Distribution (registry)
  stage: artifacts
  roles: [registry]
  description: Registre OCI de référence (image registry:2).
  license: Apache-2.0
  hosting: [docker-host, vm, kubernetes]
  provides: [registry-oci]
  landscape_name: Distribution
  verified: "2026-10-08"

- id: ghcr
  name: GitHub Container Registry
  stage: artifacts
  roles: [registry]
  description: Registre d'images de GitHub Packages (ghcr.io).
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  verified: "2026-10-08"

- id: nexus
  name: Nexus Repository
  stage: artifacts
  roles: [artifact-repo, registry]
  description: Dépôt d'artefacts (Maven, npm, PyPI, images) ; éditions Community et Pro.
  license: proprietary
  hosting: [docker-host, vm, kubernetes]
  provides: [registry-oci]
  verified: "2026-10-08"

- id: artifactory
  name: JFrog Artifactory
  stage: artifacts
  roles: [artifact-repo, registry]
  description: Dépôt d'artefacts universel.
  license: proprietary
  hosting: [saas, docker-host, vm, kubernetes]
  provides: [registry-oci]
  landscape_name: JFrog Artifactory
  verified: "2026-10-08"

- id: ecr
  name: Amazon ECR
  kind: service
  stage: artifacts
  roles: [registry]
  description: Registre d'images managé AWS.
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: aws
  landscape_name: Amazon Elastic Container Registry (ECR)
  verified: "2026-10-08"

- id: artifact-registry
  name: Google Artifact Registry
  kind: service
  stage: artifacts
  roles: [registry, artifact-repo]
  description: Registre d'images et d'artefacts managé Google Cloud.
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: gcp
  verified: "2026-10-08"

- id: gcr
  name: Google Container Registry
  kind: service
  stage: artifacts
  roles: [registry]
  description: Ancien registre d'images de Google Cloud (gcr.io).
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: gcp
  lifecycle: discontinued
  lifecycle_note: Arrêté le 18 mars 2025, remplacé par Artifact Registry.
  replacements: [artifact-registry]
  verified: "2026-10-08"

- id: acr
  name: Azure Container Registry
  kind: service
  stage: artifacts
  roles: [registry]
  description: Registre d'images managé Azure.
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: azure
  landscape_name: Azure Registry
  verified: "2026-10-08"

- id: ovh-registry
  name: OVHcloud Managed Private Registry
  kind: service
  stage: artifacts
  roles: [registry]
  description: Registre privé managé OVHcloud, basé sur Harbor.
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: ovhcloud
  verified: "2026-10-08"

- id: scaleway-registry
  name: Scaleway Container Registry
  kind: service
  stage: artifacts
  roles: [registry]
  description: Registre d'images managé Scaleway.
  license: proprietary
  hosting: [saas]
  provides: [registry-oci]
  provider: scaleway
  verified: "2026-10-08"

# ------------------------------------------------------------ IaC et config
- id: terraform
  name: Terraform
  stage: infrastructure
  roles: [iac]
  description: Infrastructure as code de HashiCorp, sous licence BSL depuis 2023.
  license: BSL-1.1
  hosting: [ci, cli]
  provides: [iac-hcl]
  alternatives: [opentofu]
  verified: "2026-10-08"

- id: opentofu
  name: OpenTofu
  stage: infrastructure
  roles: [iac]
  description: Fork open source de Terraform, projet CNCF.
  license: MPL-2.0
  hosting: [ci, cli]
  provides: [iac-hcl]
  verified: "2026-10-08"

- id: pulumi
  name: Pulumi
  stage: infrastructure
  roles: [iac]
  description: IaC dans des langages généralistes.
  license: Apache-2.0
  hosting: [ci, cli]
  verified: "2026-10-08"

- id: crossplane
  name: Crossplane
  stage: infrastructure
  extra_stages: [platform]
  roles: [iac]
  description: Provisionnement d'infrastructure par des API Kubernetes.
  license: Apache-2.0
  hosting: [kubernetes]
  alternatives_outside_k8s: [opentofu]
  verified: "2026-10-08"

- id: cloudformation
  name: AWS CloudFormation
  kind: service
  stage: infrastructure
  support: manual
  support_note: "L'infrastructure générée est écrite en Terraform ou OpenTofu."
  roles: [iac]
  description: IaC native AWS.
  license: proprietary
  hosting: [saas]
  provider: aws
  verified: "2026-10-08"

- id: bicep
  name: Azure Bicep
  kind: service
  stage: infrastructure
  support: manual
  support_note: "L'infrastructure générée est écrite en Terraform ou OpenTofu."
  roles: [iac]
  description: Langage IaC natif Azure (compilé en ARM).
  license: MIT
  repo: https://github.com/Azure/bicep
  hosting: [ci, cli]
  provider: azure
  verified: "2026-10-08"

- id: ansible
  name: Ansible
  stage: infrastructure
  extra_stages: [deploy]
  roles: [config-mgmt, deploy]
  description: Configuration et déploiement sans agent, par SSH.
  license: GPL-3.0
  hosting: [ci, cli]
  provides: [config-mgmt]
  verified: "2026-10-08"

- id: ansible-lint
  name: ansible-lint
  stage: test
  support: manual
  support_note: "Aucune étape de CI générée ; les playbooks générés passent ansible-lint dans les tests de l'application."
  roles: [config-lint]
  description: Contrôle des playbooks Ansible (bonnes pratiques, modules dépréciés, sécurité).
  homepage: https://ansible.readthedocs.io/projects/lint/
  license: GPL-3.0
  repo: https://github.com/ansible/ansible-lint
  hosting: [ci, cli]
  requires: [config-mgmt]
  verified: "2026-10-11"


# ------------------------------------------------------------ Machines virtuelles
- id: aws-ec2
  name: Amazon EC2
  kind: service
  stage: infrastructure
  roles: [compute]
  description: Machines virtuelles AWS, dans le VPC par défaut de la région. Créées par Terraform ou OpenTofu, un groupe par environnement (ou par hôte partagé) ; leurs adresses alimentent l'inventaire Ansible ou le déploiement SSH.
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: aws
  verified: "2026-10-11"

- id: gce
  name: Google Compute Engine
  kind: service
  stage: infrastructure
  roles: [compute]
  description: Machines virtuelles Google Cloud, sur le réseau par défaut. Créées par Terraform ou OpenTofu, un groupe par environnement (ou par hôte partagé) ; leurs adresses alimentent l'inventaire Ansible ou le déploiement SSH.
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [vm-hosts]
  requires: [iac-hcl]
  provider: gcp
  verified: "2026-10-11"

