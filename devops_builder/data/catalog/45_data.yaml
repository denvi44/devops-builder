  verified: "2026-10-09"

- id: ovh-databases
  name: OVHcloud Public Cloud Databases
  kind: service
  stage: data
  extra_stages: [infrastructure]
  roles: [database, sql-database, managed-database]
  description: PostgreSQL ou MySQL managé par OVHcloud.
  homepage: https://www.ovhcloud.com/fr/public-cloud/databases/
  license: proprietary
  repo: ""
  hosting: [saas]
  provides: [database]
  provider: ovhcloud
  verified: "2026-10-09"

# ------------------------------------------------------------ Migrations
- id: db-migrations
  name: Migrations de schéma
  stage: data
  extra_stages: [deploy]
  roles: [database-migrations]
  description: Applique les migrations de l'application (Alembic, Django, Prisma, Knex, goose, EF Core…) avec l'image publiée, avant chaque démarrage.
  license: MIT
  repo: ""
  hosting: [docker-host, vm, kubernetes]
  requires: [database]
  verified: "2026-10-09"
