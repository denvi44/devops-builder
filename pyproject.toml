[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "devops-builder"
version = "0.7.0"
description = "Application graphique Material pour composer des pipelines DevOps cohérents à partir du CNCF Landscape."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "qt-material>=2.14",
    "QtAwesome>=1.3",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
validate = [
    "check-jsonschema>=0.28",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
]
dev = [
    "pytest>=8",
    "check-jsonschema>=0.28",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
    "ruff>=0.5",
]

[project.scripts]
devops-builder = "devops_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devops_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E402", "E501", "E741", "UP042", "B023"]
