[build-system]
requires = ["hatchling>=1.27"]  # 1.27 : expression de licence SPDX (PEP 639)
build-backend = "hatchling.build"

[project]
name = "izinum-devops-builder"
version = "0.20.0"
description = "Application graphique Material pour composer des pipelines DevOps cohérents à partir du CNCF Landscape."
readme = "README.md"
requires-python = ">=3.11,<3.15"  # PySide6 6.11 : pas de Python 3.15
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vincent Denise" }]
keywords = ["devops", "ci-cd", "cncf", "kubernetes", "terraform", "pipeline", "générateur"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # PySide6 6.12.0 décrémente trop le compteur de références : plantage à la sortie sous Python 3.11,
    # erreur de segmentation intermittente sous 3.12 (CI du 13 octobre). À lever avec une 6.12.x corrigée.
    "PySide6>=6.6,<6.12",
    "qt-material>=2.14",
    "QtAwesome>=1.3",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
validate = [
    "check-jsonschema>=0.28",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
]
dev = [
    "pytest>=8",
    "check-jsonschema>=0.28",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
    "ruff>=0.5",
]

[project.urls]
Source = "https://github.com/denvi44/devops-builder"
Documentation = "https://github.com/denvi44/devops-builder#readme"
Signalements = "https://github.com/denvi44/devops-builder/issues"
Changements = "https://github.com/denvi44/devops-builder/blob/main/CHANGELOG.md"

[project.scripts]
devops-builder = "devops_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devops_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E402", "E501", "E741", "UP042", "B023"]
